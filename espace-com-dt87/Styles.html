/* Intégrations */
.ph-bandeau { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.ph-bandeau-item { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 6px; overflow: hidden; }
.ph-bandeau-item .ph-vig { aspect-ratio: 1; }
.ph-bandeau-item:focus-visible { outline: 3px solid var(--actif); outline-offset: 1px; }
.ph-a-valider { text-decoration: none !important; margin: 0 0 10px; }
.ph-mini-liste { display: flex; flex-wrap: wrap; gap: 8px; }
.ph-mini { position: relative; width: 96px; }
.ph-mini .ph-vig { border-radius: 6px; aspect-ratio: 1; }
.ph-mini .btn-icone { position: absolute; top: 2px; right: 2px; width: 30px; height: 30px; min-height: 0; background: rgba(0,0,0,.55); color: #ffffff; border-radius: 50%; }
.ph-evenement { margin-top: 6px; }
@media (max-width: 1100px) { .ph-fiche { grid-template-columns: minmax(0, 1fr); } .ph-scene { height: min(56vh, 600px); } .ph-import { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) {
  .entete-page > div:last-child { max-width: 100%; }
  .entete-page .btn { white-space: normal; text-align: left; }
  .ph-grille { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ph-legende { padding: 18px 8px 6px; }
  .ph-albums { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .voile:has(.modale-photo) { padding: 0; }
  .modale.modale-photo { max-height: 100vh; height: 100%; border-radius: 0; }
  .ph-scene { height: 52vh; min-height: 220px; border-radius: 0; margin: 0 -22px; }
  .ph-meta, .ph-tech .infos { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ph-actions-fiche .btn, .ph-plus-liste .btn { flex: 1 1 auto; }
  .ph-nav { width: 40px; height: 40px; }
  .ph-barre-sel { bottom: 78px; }
  .ph-barre-sel .ph-actions { margin-left: 0; width: 100%; }
  .ph-barre-sel .ph-actions .btn { flex: 1 1 auto; }
  .ph-album-actions { width: 100%; }
}
@media (max-width: 900px) and (max-height: 500px) { .ph-scene { height: 78vh; } .ph-barre-sel { bottom: 56px; } }
@media (min-width: 1600px) { .ph-grille { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } .modale.modale-photo { max-width: 1480px !important; } .ph-scene { height: min(76vh, 980px); } }

/* ===== Matériel et réservations (3.12) ===== */
.mat-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.mat-carte { display: flex; flex-direction: column; text-align: left; background: var(--carte); border: var(--ep) solid var(--bord); border-radius: var(--rayon); overflow: hidden; cursor: pointer; padding: 0; color: inherit; box-shadow: var(--ombre); font: inherit; }
.mat-carte:hover { border-color: var(--bord-2); }
.mat-carte:focus-visible { outline: 2px solid var(--actif); outline-offset: 2px; }
.mat-txt { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px; min-width: 0; }
.mat-txt b { overflow: hidden; text-overflow: ellipsis; }
.mat-txt .pastille { align-self: flex-start; margin-top: 2px; }
.mat-vig { display: flex; align-items: center; justify-content: center; background: var(--survol); color: var(--texte-3); aspect-ratio: 4 / 3; overflow: hidden; flex: none; }
.mat-vig img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mat-vig .ic { width: 34px; height: 34px; }
.mat-vig.grand { width: 220px; max-width: 100%; border-radius: var(--rayon-s); }
.mat-fiche { display: flex; gap: 16px; align-items: flex-start; }
.mat-form-photo { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.mat-form-photo .mat-vig.grand { width: 140px; }
.mat-resas { display: grid; gap: 8px; }
.mat-resa { display: flex; gap: 12px; align-items: center; background: var(--carte); border: var(--ep) solid var(--bord); border-radius: var(--rayon-s); padding: 10px 12px; }
.mat-resa > .mat-vig { width: 64px; border-radius: 6px; }
.mat-resa .quoi { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.mat-resa-droite { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.mat-resa-actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.mat-occ, .mat-suivi, .mat-jour { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mat-occ li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.mat-jour li { display: flex; gap: 10px; align-items: center; background: var(--carte); border: var(--ep) solid var(--bord); border-radius: var(--rayon-s); padding: 8px 10px; }
.mat-jour .evt { flex: 1; min-width: 0; }
.mat-heure { font-weight: 600; font-size: 13px; min-width: 96px; }
.mr-actions { margin-top: 12px; }
.mr-actions .btn { width: 100%; justify-content: center; }
.mat-legende { display: inline-flex; gap: 8px; align-items: center; }
.mat-evt { background: var(--vert-pale); color: var(--vert-texte); border-left-color: var(--succes, #1f8a4c); }
.mat-evt.attente { background: var(--orange-pale); color: var(--orange-texte); border-left-style: dashed; border-left-color: var(--avertissement, #c26a00); }
.mat-evt.moi { font-weight: 600; }
.mois .n.mat-n { border: none; background: none; cursor: pointer; color: inherit; padding: 0; font: inherit; font-size: 12px; font-weight: 600; }
.mois .jour.auj .n.mat-n { background: var(--rouge); color: #fff; }
.mat-n-sem { border: none; background: none; padding: 0; cursor: pointer; text-align: left; color: inherit; font: inherit; text-transform: capitalize; }
@media (max-width: 600px) {
  .mat-grille { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .mat-fiche { flex-direction: column; }
  .mat-vig.grand { width: 100%; }
  .mat-resa { flex-wrap: wrap; }
  .mat-resa-droite { align-items: flex-start; width: 100%; }
  .mat-resa-actions { justify-content: flex-start; }
  .mat-resa-actions .btn { min-height: 40px; }
  .mat-heure { min-width: 74px; }
}

/* ===== 3.13 : accueil personnalisé et import de photos en arrière-plan ===== */
.annonce-accueil { margin: 0 0 16px; white-space: pre-line; }
.a-faire { margin-bottom: 18px; border-left: 3px solid var(--rouge); }
.a-faire .corps { padding-top: 6px; }
.a-faire .ligne-suivi .quoi { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.a-faire .ligne-suivi .aller { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--texte-2); white-space: nowrap; }
.import-flottant { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; align-items: center; gap: 12px; max-width: 360px; background: var(--carte); color: var(--texte); border: var(--ep) solid var(--bord); border-radius: var(--rayon); box-shadow: var(--ombre-l); padding: 10px 12px; font-size: 13px; }
.import-flottant > span { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.import-flottant .barre { display: block; height: 6px; border-radius: 999px; background: var(--survol); overflow: hidden; }
.import-flottant .barre i { display: block; height: 100%; background: var(--rouge); border-radius: 999px; transition: width var(--duree); }
.ph-import-ligne.etat-enreg .pastille { opacity: .85; }
@media (max-width: 900px) {
  .import-flottant { left: 12px; right: 12px; max-width: none; bottom: calc(68px + env(safe-area-inset-bottom)); }
  .a-faire .ligne-suivi .aller { font-size: 0; gap: 0; }
}

/* ===== 3.14 : notifications (cloche) et activité récente ===== */
.btn-notifs-mobile { position: relative; }
.btn-notifs-mobile .badge-notifs { position: absolute; top: 2px; right: 0; background: var(--rouge); color: #fff; font-size: 10.5px; font-weight: 600; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.nf-onglets { display: flex; width: 100%; margin-bottom: 12px; }
.nf-onglets button { flex: 1; min-height: 40px; }
.nf-onglets button.actif { background: var(--rouge-pale); color: var(--rouge-fonce); }
.nf-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.nf-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nf-liste > li { min-width: 0; }
.nf { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: var(--rayon-s); color: inherit; text-decoration: none !important; min-height: 44px; }
a.nf:hover { background: var(--survol); }
.nf .pt { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.nf .pt svg { width: 16px; height: 16px; }
.nf .quoi { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.nf .quoi b { font-weight: 500; overflow-wrap: anywhere; }
.nf.non-lue { background: var(--rouge-pale); }
.nf.non-lue .quoi b { font-weight: 700; }
.nf-texte { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.nf-point { width: 9px; height: 9px; border-radius: 50%; background: var(--rouge); flex: none; margin-top: 6px; }
.nf-nb { display: inline-block; background: var(--rouge); color: #fff; font-size: 11px; font-weight: 600; border-radius: 9px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.nf-liste.compacte .nf { padding: 8px 6px; }
.nf-zone { min-height: 120px; }
@media (max-width: 900px) { .nf .pt { width: 28px; height: 28px; } }

/* ===== 3.15 : Mon Centre Com (favoris, brouillons, suivi, personnes associées, agenda) et confort mobile ===== */
.entete-page .actions-entete { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn-favori svg.ic { fill: none; }
.btn-favori.on { color: #c79a00; }
.btn-favori.on svg.ic { fill: #f5c400; stroke: #c79a00; }
.ressource-bloc { position: relative; min-width: 0; }
.ressource-bloc > .ressource { height: 100%; padding-right: 52px; }
.ressource-bloc > .btn-favori { position: absolute; top: 8px; right: 8px; }
.prochaine-action { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--rayon); border: var(--ep) solid var(--bord); background: var(--carte); margin-bottom: 18px; }
.prochaine-action .pt { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; background: var(--bleu-pale); color: var(--bleu-texte); }
.prochaine-action.vous { border-color: var(--rouge); background: var(--rouge-pale); }
.prochaine-action.vous .pt { background: var(--rouge); color: #fff; }
.prochaine-action.fin .pt { background: var(--vert-pale); color: var(--vert-texte); }
.brouillon-ligne { display: flex; align-items: center; gap: 4px; }
.brouillon-ligne > .ligne-suivi { flex: 1; min-width: 0; }
.ligne-suivi .quoi { min-width: 0; }
.ligne-suivi .quoi b { overflow-wrap: anywhere; }
.form-pied { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.form-pied-droite { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.as-liste { max-height: 50vh; overflow: auto; margin-top: 4px; }
.mini-agenda .ligne-agenda .quoi b svg.ic { width: 14px; height: 14px; vertical-align: -2px; }
@media (max-width: 900px) {
  /* Demande : suivi et actions avant le texte de la demande ; actions de la fiche et des formulaires toujours accessibles */
  .detail-demande > .pile:last-child { order: -1; }
  .entete-page .actions-entete { width: 100%; }
  .entete-page .actions-entete #d-dupliquer { flex: 1; }
  .form-pied { position: sticky; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 5; background: var(--fond); padding: 10px 0; margin-left: -2px; margin-right: -2px; }
  .modale .pied { position: sticky; bottom: 0; background: var(--carte); padding-top: 12px; border-top: var(--ep) solid var(--bord); }
  .ressource-bloc > .btn-favori { top: 4px; right: 4px; }
}
@media (max-width: 480px) {
  /* deux lignes compactes : Annuler + Brouillon, puis l'action principale sur toute la largeur */
  .form-pied { gap: 8px; }
  .form-pied > #n-annuler { flex: 1 1 30%; }
  .form-pied-droite { display: contents; }
  .form-pied-droite #n-brouillon { flex: 1 1 60%; }
  .form-pied-droite #n-suite { flex: 1 1 100%; order: 3; }
  .entete-page .actions-entete .btn span { display: inline; }
}
@media (max-width: 900px) and (max-height: 500px) { .form-pied { position: static; } }

/* ===== 3.16 : fichiers partout (composant commun), Mes favoris, mode utilisateur ===== */
.champ-fichiers .cf-ligne { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.champ-fichiers .cf-choisir { cursor: pointer; }
.cf-liste { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.cf-liste li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: var(--ep) solid var(--bord); border-radius: var(--rayon-s); background: var(--survol); min-width: 0; }
.cf-liste li .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pieces .res-ext { width: 38px; height: 30px; font-size: 10px; flex: none; }
.ressource-bloc > .res-joint { position: absolute; bottom: 8px; right: 8px; }
.annonce-accueil { align-items: center; }
.annonce-accueil .btn-favori { margin: -6px -6px -6px 0; }
.bandeau-mode { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: #1f2a44; color: #fff; font-size: 13.5px; }
.bandeau-mode > span { flex: 1; min-width: 200px; }
.bandeau-mode .btn { background: #fff; color: #1f2a44; border-color: #fff; }
html.mode-utilisateur .nav { top: 0; }
.favoris-liste .ligne-suivi { min-height: 48px; }
@media (max-width: 900px) {
  .bandeau-mode { padding: 8px 12px; font-size: 13px; }
  .bandeau-mode .btn { flex: 1 1 100%; }
  .ressource-bloc > .res-joint { bottom: 4px; right: 4px; }
}

/* ===== 3.17 : tableau de bord et confort de l'administration ===== */
.admin-titre { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.admin-titre h2 { margin: 0; }
.kpis-pilotage { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.kpis-pilotage .kpi .tres-petit { margin-top: 4px; }
.tb-roles { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: var(--ep) solid var(--bord); }
.tb-grille { margin-top: 4px; }
.barre-selection { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; margin: 0 0 12px; border-radius: var(--rayon); background: var(--bleu-pale); color: var(--bleu-texte); border: var(--ep) solid var(--bord); }
.barre-selection[hidden] { display: none; }
.barre-selection > span { font-weight: 600; margin-right: auto; }
.barre-selection .champ { width: auto; min-width: 180px; }
.table .col-sel { width: 44px; text-align: center; }
.table .col-sel input { width: 20px; height: 20px; accent-color: var(--rouge); cursor: pointer; }
.perms-role { margin-top: 8px; }
.perms-role summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; gap: 6px; }
.perms-liste { margin: 6px 0 0; padding-left: 20px; columns: 2; font-size: 13px; }
@media (max-width: 700px) {
  .perms-liste { columns: 1; }
  .barre-selection .champ, .barre-selection .btn { flex: 1 1 100%; }
  .table.cartes-mobile .col-sel { width: auto; text-align: left; }
}
@media (pointer: coarse), (max-width: 900px) { .table .col-sel input { width: 26px; height: 26px; } }
/* 3.26 — Projets, sélection groupée des demandes */
.grille-projets { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.carte-projet { display: block; margin: 0; color: inherit; text-decoration: none; transition: box-shadow .15s, transform .15s; }
.carte-projet:hover, .carte-projet:focus-visible { box-shadow: 0 4px 14px rgba(0, 0, 0, .08); transform: translateY(-1px); }
.texte-coupe { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 6px 0 0; }
.barre-selection { position: sticky; top: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; margin: 0 0 12px; background: var(--carte); border: var(--ep, 1px) solid var(--bord); border-radius: 10px; box-shadow: 0 2px 10px rgba(0, 0, 0, .06); }
.barre-selection .champ { width: auto; min-width: 140px; }
.liste-dem .dem.choisie { outline: 2px solid var(--rouge); outline-offset: -2px; background: color-mix(in srgb, var(--rouge) 6%, transparent); }
@media (max-width: 640px) { .barre-selection .champ { min-width: 0; flex: 1 1 45%; } }
/* 3.27 — Mon Centre Com personnalisable, thème personnel */
.acc-petit { display: none; }
@media (max-width: 640px) { .acc-large { display: none; } .acc-petit { display: inline; } }
.acc-zone.acc-haut > .acc-mod + .acc-mod { margin-top: 0; }
.acc-barre { position: sticky; top: 8px; z-index: 6; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; margin: 0 0 16px; background: var(--carte); border: var(--ep) solid var(--rouge); border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, .08); }
.acc-barre-txt { display: flex; flex-direction: column; gap: 2px; }
.acc-barre-act, .acc-masques { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.acc-masques { margin-top: 2px; }
.acc-edition .acc-zone { min-height: 64px; padding: 6px; border: 2px dashed var(--bord-2); border-radius: 12px; }
.acc-edition .acc-zone.acc-haut { margin-bottom: 16px; }
.acc-edition .acc-mod { position: relative; padding: 0 0 8px; border-radius: 12px; background: color-mix(in srgb, var(--survol) 60%, transparent); }
.acc-edition .acc-zone > .acc-mod + .acc-mod { margin-top: 12px; }
.acc-edition .acc-mod > :not(.acc-outils):not(.acc-actions-edition) { pointer-events: none; opacity: .82; }
.acc-outils { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; margin-bottom: 8px; background: var(--carte); border: var(--ep) solid var(--bord); border-radius: 10px; }
.acc-outils .acc-titre { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc-espace { flex: 1; }
.acc-outils .acc-taille { width: auto; min-width: 0; padding-top: 4px; padding-bottom: 4px; font-size: 13px; }
.acc-poignee, .acc-poignee-act { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: inherit; font: inherit; cursor: grab; touch-action: none; padding: 6px; border-radius: 8px; }
.acc-poignee:hover, .acc-poignee:focus-visible { background: var(--survol); }
.acc-mod.en-glisse, .acc-action.en-glisse { opacity: .92; box-shadow: 0 12px 30px rgba(0, 0, 0, .22); cursor: grabbing; }
.acc-place { display: block; border: 2px dashed var(--rouge); border-radius: 12px; background: color-mix(in srgb, var(--rouge) 6%, transparent); margin: 6px 0; }
span.acc-place { display: inline-block; vertical-align: top; margin: 0; }
body.glisse-actif { user-select: none; -webkit-user-select: none; cursor: grabbing; }
.acc-vide { margin: 0; }
.acc-actions-edition .acc-action { display: inline-flex; flex-direction: column; align-items: stretch; gap: 4px; }
.acc-act-outils { display: flex; justify-content: center; gap: 4px; }
.acc-actions-edition .acc-action { min-width: 0; }
.acc-poignee-act { min-width: 0; max-width: 100%; }
.acc-poignee-act span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc-act-outils button { border: var(--ep) solid var(--bord); background: var(--carte); color: inherit; border-radius: 6px; min-width: 30px; min-height: 30px; cursor: pointer; }
.acc-act-outils button:disabled { opacity: .35; cursor: default; }
.nav .pied .btn-theme { width: 100%; margin-top: 8px; font-size: 13px; padding: 7px 10px; justify-content: center; }
html[data-nav="couleur"] .nav .btn-theme, html[data-nav="sombre"] .nav .btn-theme { background: transparent; color: inherit; border-color: rgba(255,255,255,.4); }
@media (max-width: 640px) {
  .acc-poignee, .acc-poignee-act { cursor: default; touch-action: auto; pointer-events: none; }
  .acc-poignee svg { display: none; }
  .acc-outils .btn-icone { min-width: 40px; min-height: 40px; }
  .acc-barre { position: static; }
  .acc-actions-edition .raccourcis { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; overflow: visible; }
  .acc-actions-edition .acc-action { flex-direction: row; align-items: center; justify-content: space-between; }
  .acc-act-outils button { min-width: 40px; min-height: 40px; }
}
/* 3.28 — Diffusion interne */
.diff-message { white-space: pre-wrap; line-height: 1.6; }
/* 3.30 — Matériel : galerie de photos (fiche, visionneuse plein écran, gestion) */
.modale.modale-mat { max-width: 980px !important; }
.mat-fiche .mat-galerie { flex: 0 0 52%; min-width: 0; }
