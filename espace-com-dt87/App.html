  if (!s) return '';

  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return 'à l\'instant'; if (m < 60) return 'il y a ' + m + ' min';
  const hh = Math.round(m / 60); if (hh < 24) return 'il y a ' + hh + ' h';

function serveur() {
  const g = window.google && window.google.script && window.google.script.run;
  if (!g) throw { erreur: 'environnement', message: 'Le service d\'appel serveur de Google est absent : ouvrez le Centre Com depuis son adresse Apps Script (…/exec).' };

// Logo choisi par l'administrateur : vérifié (image lisible), réduit à 800 px au plus si besoin (PNG : transparence gardée) ; SVG envoyé tel quel
function pngCourriel(img) {   // version PNG (600 × 160 px au plus) du logo pour les e-mails
  try { const k = Math.min(1, 600 / img.naturalWidth, 160 / img.naturalHeight), cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k)); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); return cv.toDataURL('image/png').split(',')[1]; } catch (e) { return ''; }
}
function preparerLogo(fich) {
  return new Promise((res, rej) => {
    if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(fich.type)) return rej({ message: 'Choisissez une image PNG, JPEG, WebP ou SVG.' });
    if (fich.type === 'image/svg+xml' && fich.size > 400 * 1024) return rej({ message: 'Logo SVG trop lourd (400 Ko au plus).' });
    const url = URL.createObjectURL(fich), img = new Image();
    let png = '';
    const lire = () => { const r = new FileReader(); r.onload = () => res({ nom: fich.name, mime: fich.type, data: String(r.result).split(',')[1], png: png }); r.onerror = () => rej({ message: 'Fichier illisible.' }); r.readAsDataURL(fich); };
    img.onload = () => {
      URL.revokeObjectURL(url);
      png = pngCourriel(img);
      if (fich.type === 'image/svg+xml') return lire();
      const k = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
      if (k === 1 && fich.size <= 400 * 1024) return lire();
      const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const type = fich.type === 'image/jpeg' ? 'image/jpeg' : 'image/png', d = cv.toDataURL(type, .92);
      res({ nom: fich.name, mime: type, data: d.split(',')[1], png: png });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ message: 'Cette image ne peut pas être lue (fichier endommagé ?).' }); };
    img.src = url;
  });
}

// Glisser-déposer par événements « pointer » (souris, stylet et toucher) : un emplacement suit le pointeur, l'élément est posé au relâchement
function activerGlisser(racine, o) {

}

  const livrable = d.livrable_url ? '<div class="bloc-livrable"><div class="ico">' + ic('file') + '</div><div style="flex:1;min-width:0"><b>' + (cl === 'a_valider' ? 'Proposition' : 'Livrable') + '</b><div class="petit muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(livPiece ? livPiece.nom : d.livrable_url) + '</div></div>' + (livPiece ? '<a href="#" class="btn petit" data-piece="' + h(livPiece.id) + '">' + ic('file') + 'Voir</a>' : '<a class="btn petit" href="' + lien(d.livrable_url) + '" target="_blank" rel="noopener">' + ic('external') + 'Ouvrir</a>') + '</div>' : '';

  const hist = r.historique.map(x => {
    const estDem = x.auteur === d.demandeur_email;

    const qui = '<b>' + h(x.auteur_nom || nomDe(x.auteur) || x.auteur) + '</b> · ' + depuis(x.date);
    if (x.type === 'message' || x.type === 'note') return '<li><span class="point">' + ic(icone) + '</span><div class="bulle"><div class="qui">' + qui + (x.type === 'note' ? ' · <span class="tres-petit">note interne</span>' : '') + '</div><div class="msg ' + (x.type === 'note' ? 'interne' : estDem ? '' : 'equipe') + '">' + h(x.message) + '</div></div></li>';
    return '<li><span class="point">' + ic(icone) + '</span><div class="bulle"><div class="qui">' + qui + '</div><div class="petit">' + h(x.message) + '</div></div></li>';
  }).join('');

  const infos = [
    ['UL / structure', h(d.ul)], ['Type', h(t.libelle)],
    ['Pour le', '<span class="echeance ' + ech.c + '">' + (d.echeance ? fmt(d.echeance) : '—') + '</span>'],
    d.date_action ? ['Date de l\'action', fmt(d.date_action)] : null, d.lieu ? ['Lieu', h(d.lieu)] : null,
    ['Demandeur', h(d.demandeur_nom || '—') + (e ? '<div class="petit muted"><a href="mailto:' + h(d.demandeur_email) + '">' + h(d.demandeur_email) + '</a>' + (d.telephone ? ' · ' + h(d.telephone) : '') + '</div>' : '')],
    ['Déposée', fmt(String(d.cree_le).slice(0, 10))],
  ].filter(Boolean).map(x => '<div><div class="k">' + x[0] + '</div><div class="v">' + x[1] + '</div></div>').join('');

  const peutEcrire = e || d.demandeur_email === u.email || d.associe || (peut('demande_voir_ul') && u.ul && d.ul === u.ul);
  // Colonne de droite
  let droite;
  if (e) {
    // Actions rapides selon le TYPE de statut ; la liste complète des statuts (configurables) est dans le menu déroulant
    const actions = ({
      nouvelle: [['en_cours', 'user', 'Prendre en charge', 'principal'], ['attente', 'message', 'Demander une information'], ['annulee', 'x', 'Réorienter ou annuler']],
      en_cours: [['a_valider', 'send', 'Envoyer pour validation', 'principal'], ['terminee', 'check', 'Marquer comme livrée'], ['attente', 'message', 'Demander une information']],
      attente: [['en_cours', 'refresh', 'Reprendre le traitement', 'principal'], ['annulee', 'x', 'Réorienter ou annuler']],
      a_valider: [['terminee', 'check', 'Marquer comme livrée', 'principal'], ['en_cours', 'refresh', 'Reprendre (modifications)']],
      terminee: [['archivee', 'archive', 'Archiver'], ['en_cours', 'refresh', 'Rouvrir la demande']], annulee: [['archivee', 'archive', 'Archiver'], ['en_cours', 'refresh', 'Rouvrir la demande']],
      archivee: [['en_cours', 'refresh', 'Rouvrir la demande']],
    }[cl] || []).map(a => [premierStatut(a[0])].concat(a.slice(1))).filter(a => a[0] !== d.statut && CFG().demandes.statuts.some(x => x.code === a[0]));
    const optStatuts = CFG().demandes.statuts.map(x => '<option value="' + h(x.code) + '"' + (x.code === d.statut ? ' selected' : '') + '>' + h(x.label) + '</option>').join('');
    const optResp = '<option value="">Non attribuée</option>' + S.ses.equipe.map(x => '<option value="' + h(x.email) + '"' + (x.email === d.responsable ? ' selected' : '') + '>' + h(x.nom) + '</option>').join('');
    droite = '<div class="carte"><div class="tete"><h2>Traiter</h2>' + pastille(d) + '</div><div class="corps"><div class="actions-rapides">' +
      actions.map(a => '<button class="btn ' + (a[3] || '') + '" data-statut="' + h(a[0]) + '">' + ic(a[1]) + a[2] + '</button>').join('') + '</div>' +
      '<div style="height:16px"></div><div class="form-ligne"><label for="c-statut">Statut</label><select class="champ" id="c-statut">' + optStatuts + '</select></div>' +
      '<div class="form-ligne"><label for="c-resp">Pris en charge par</label><select class="champ" id="c-resp">' + optResp + '</select></div>' +
      '<div class="form-ligne"><label for="c-ech">Échéance</label><input class="champ" type="date" id="c-ech" value="' + h(d.echeance) + '"></div>' +
      '<div class="form-ligne" style="margin-bottom:0"><label>Livrable</label>' + (livrable || '<p class="petit muted">Aucun livrable pour l\'instant. Ajoutez-le au moment d\'envoyer pour validation ou de terminer.</p>') + '</div>' +
      '</div></div>';
    if (t.pole === 'image') {
      droite += '<div class="carte"><div class="tete"><h2>' + ic('camera') + ' Pôle image</h2></div><div class="corps">' +
        '<div class="form-ligne"><label for="c-photo">Photographe / vidéaste</label><input class="champ" id="c-photo" value="' + h(d.photographe) + '" placeholder="Prénom Nom"></div>' +
        '<div class="form-ligne"><label for="c-auto">Autorisations de droit à l\'image</label><select class="champ" id="c-auto">' + CFG().pole_image.autorisations.map(x => x.nom).map(a => '<option' + (a === d.autorisations ? ' selected' : '') + '>' + h(a) + '</option>').join('') + '</select></div>' +
        '<div class="form-ligne"><label for="c-credit">Crédit photo</label><input class="champ" id="c-credit" value="' + h(d.credit) + '" placeholder="' + h(CFG().pole_image.credit_modele) + '"></div>' +
        '<div class="form-ligne"><label for="c-sel">Sélection d\'images (lien du dossier dans le Drive partagé)</label><input class="champ" id="c-sel" type="url" value="' + h(d.selection_url) + '" placeholder="https://drive.google.com/…"></div>' +
        (fonctionDispo('api_joindre') && fonction('fichiers_demandes') ? champFichiers('c-sel-f', { label: 'Ajouter des images', multiple: true, aide: 'Lien, fichiers ou les deux · 10 Mo au plus par fichier' }) : '') +
        (d.selection_url ? '<a class="btn petit" style="margin-bottom:10px" href="' + lien(d.selection_url) + '" target="_blank" rel="noopener">' + ic('image') + 'Ouvrir la sélection</a>' : '') +
        '<button class="btn bloc" id="b-image">' + ic('check') + 'Enregistrer</button></div></div>';
    }
    if (d.dossier_url) droite += '<a class="btn bloc" href="' + lien(d.dossier_url) + '" target="_blank" rel="noopener">' + ic('folder') + 'Fichiers de la demande</a>';
  } else {
    const etapes = [['Reçue', true], ['Prise en charge', ['en_cours', 'attente', 'a_valider', 'terminee', 'archivee'].includes(cl)], [statut(premierStatut('terminee')).label, cl === 'terminee' || (cl === 'archivee' && !!d.livrable_url)]];
    droite = '<div class="carte"><div class="tete"><h2>Suivi</h2>' + pastille(d) + '</div><div class="corps"><ul class="chrono">' +
      etapes.map(x => '<li><span class="point" style="' + (x[1] ? 'background:var(--rouge);color:#fff' : '') + '">' + ic(x[1] ? 'check' : 'clock') + '</span><div class="bulle" style="padding-top:5px"><b>' + x[0] + '</b></div></li>').join('') + '</ul>' +
      '<div class="infos" style="grid-template-columns:1fr"><div><div class="k">Pris en charge par</div><div class="v" style="display:flex;align-items:center;gap:8px">' + (d.responsable ? avatar(d.responsable, false, true) : '') + h(d.responsable ? nomDe(d.responsable) : 'Bientôt attribuée') + '</div></div></div>' +
      ((cl === 'terminee' || cl === 'archivee') && livrable ? '<div style="margin-top:14px">' + livrable + '</div>' : '') + '</div></div>' +
      (d.selection_url && (cl === 'terminee' || cl === 'archivee') ? '<a class="btn bloc" href="' + lien(d.selection_url) + '" target="_blank" rel="noopener">' + ic('image') + 'Sélection d\'images</a>' : '') +
      (d.dossier_url && !fonctionDispo('api_joindre') ? '<a class="btn bloc" href="' + lien(d.dossier_url) + '" target="_blank" rel="noopener">' + ic('folder') + 'Vos fichiers envoyés</a>' : '');
  }

  el.innerHTML = '<button class="retour" data-go="demandes">' + ic('left') + (e ? 'Demandes' : 'Mes demandes') + '</button>' +
    '<div class="entete-page"><div><div class="sur">' + h(d.id) + ' · ' + h(t.libelle) + '</div><h1>' + h(d.titre) + '</h1><div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">' + pastille(d) + prio(p) + '<span class="etiquette echeance ' + ech.c + '">' + ic('clock') + h(ech.t) + '</span>' + (d.associe ? '<span class="pastille ton-violet">' + ic('users') + 'Vous êtes associé(e)</span>' : '') + '</div></div>' +
    '<div class="actions-entete">' + (fonctionDispo('api_favori') ? boutonFavori('demande', d.id, d.titre) : '') + (peut('demande_creer') && S.ses.types.some(x => x.code === d.type) ? '<button type="button" class="btn" id="d-dupliquer" title="Nouvelle demande pré-remplie à partir de celle-ci">' + ic('copy') + '<span>Dupliquer</span></button>' : '') +
      (peut('demande_creer') && fonctionDispo('api_brouillon') && S.ses.types.some(x => x.code === d.type) ? '<button type="button" class="btn" id="d-modele" title="Garder cette demande comme modèle pour en refaire de semblables">' + ic('star') + '<span>Modèle</span></button>' : '') + '</div></div>' +
    bandeau + (bandeau ? '' : blocProchaineAction(d)) +
    '<div class="grille g-principale detail-demande"><div class="pile">' +
    '<div class="carte"><div class="tete"><h2>La demande</h2></div><div class="corps"><p class="texte-long" style="margin-bottom:16px">' + h(d.description) + '</p><div class="infos">' + infos + lignesDetails + '</div></div></div>' +
    '<div class="carte"><div class="tete"><h2>Échanges et historique</h2></div><div class="corps"><ul class="chrono">' + hist + '</ul>' +
    (peutEcrire ? '<div style="border-top:var(--ep) solid var(--bord);padding-top:14px;margin-top:4px"><label class="sr" for="c-msg">Message</label><textarea class="champ" id="c-msg" placeholder="' + (e ? 'Écrire au demandeur…' : 'Écrire à l\'équipe communication…') + '" style="min-height:80px"></textarea>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap">' +
    (peut('notes_internes') ? '<label class="petit" style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="c-interne" style="accent-color:var(--rouge)"> Note interne (le demandeur ne la voit pas)</label>' : '<span class="petit muted">' + (e ? 'Le demandeur est prévenu par e-mail.' : 'L\'équipe est prévenue par e-mail.') + '</span>') +
    (fonctionDispo('api_mentionnables') ? '<span style="display:flex;gap:8px;margin-left:auto"><button type="button" class="btn fantome" id="b-mention" title="Prévenir une personne qui suit cette demande">@ Mentionner</button>' : '<span style="display:flex;gap:8px;margin-left:auto">') + '<button class="btn principal" id="b-msg">' + ic('send') + 'Envoyer</button></span></div><div id="c-mentions" class="tres-petit muted" style="margin-top:6px"></div>' + (fonctionDispo('api_joindre') && fonction('fichiers_demandes') ? champFichiers('c-msg-f', { multiple: true, label: 'Joindre des fichiers' }) : '') + '<div class="tres-petit muted" id="c-msg-prog"></div></div>' : '<p class="petit muted" style="border-top:var(--ep) solid var(--bord);padding-top:12px">Consultation seule : votre rôle ne permet pas d\'écrire sur cette demande.</p>') + '</div></div>' +
    '</div><div class="pile">' + droite + (r.pieces && r.pieces.length ? '<div class="carte" id="carte-fichiers"><div class="tete"><h2>Fichiers</h2><span class="tres-petit muted">' + pluriel(r.pieces.length, 'fichier', 'fichiers') + (r.pieces.length > 1 && fonctionDispo('api_piecesZip') ? ' <button type="button" class="btn fantome petit" id="d-zip" title="Tous les fichiers de la demande en un seul ZIP">' + ic('download') + 'Tout télécharger</button>' : '') + '</span></div><div class="corps">' + listePiecesHtml(r.pieces) + '<p class="tres-petit muted" style="margin:8px 0 0">' + ic('lock') + ' Ouverts par le Centre Com : aucun accès au Drive partagé n\'est nécessaire.</p></div></div>' : '') +
    (fonctionDispo('api_participants') ? carteParticipants(d) : '') + carteProjetsDemande(r, d) + photosDemandeHtml(r, d) + '</div></div>';
  brancherRetraitPieces(el, () => vDemande(el, true));
  brancherPhotosDemande(el, r, d);
  brancherMessageGarde(el, d.id);
  brancherParticipants(el, d, nd => { majDemandeLocale(nd); vDemande(el, true); });
  { const b = $('#d-dupliquer'); if (b) b.onclick = () => dupliquerDemande(d); }
  { const b = $('#d-modele'); if (b) b.onclick = () => enregistrerModeleDemande(d); }
  brancherProjetsDemande(el, d, () => vDemande(el, true));
  { const b = $('#d-zip'); if (b) b.onclick = async ev => { occupe(ev.currentTarget, true); try { const z = await api('api_piecesZip', d.id); telechargerBlob({ url: URL.createObjectURL(b64Blob(z.data, 'application/zip')), nom: z.nom }); toast(pluriel(z.nombre, 'fichier téléchargé', 'fichiers téléchargés') + ' (ZIP).'); } catch (x) { erreur(x); } occupe(ev.currentTarget, false); }; }
  const MENT = brancherMentions(el, d);

  // Après une action : la fiche est relue (un appel) et la liste mise à jour sur place, sans écran vide
  const recharger = async (msg, r) => { S.cal = null; if (msg) toast(msg); await vDemande(el, true, r && r.fiche); majCompteNav(); };
  const CM = $('#c-msg-f') ? brancherFichiers(el, 'c-msg-f', { multiple: true }) : null;
  if ($('#b-msg')) $('#b-msg').onclick = async ev => {
    const m = $('#c-msg').value.trim(), fichiers = CM ? CM.fichiers.slice() : [];
    if (!m && !fichiers.length) return $('#c-msg').focus();
    const interne = !!$('#c-interne') && $('#c-interne').checked;
    if (interne && fichiers.length && !confirm('Les fichiers joints restent visibles par le demandeur (seul le texte de la note est interne). Continuer ?')) return;
    const b = ev.currentTarget; occupe(b, true);
    try {
      if (fichiers.length) { await envoyerFichiers('demande', d.id, 'joint', fichiers, $('#c-msg-prog')); CM.fichiers = []; }
      const r = m ? await api('api_message', d.id, m, interne, true, MENT.cles(m)) : null; oublierMessage(d.id);
      await recharger(m ? (interne ? 'Note ajoutée.' : 'Message envoyé.') + (fichiers.length ? ' ' + pluriel(fichiers.length, 'fichier joint', 'fichiers joints') + '.' : '') : pluriel(fichiers.length, 'fichier ajouté', 'fichiers ajoutés') + ' à la demande.', r);
    } catch (x) { erreur(x); occupe(b, false); }
  };
  if (e) {
    el.querySelectorAll('[data-statut]').forEach(b => b.onclick = () => modaleStatut(d, b.dataset.statut, recharger));
    $('#c-statut').onchange = ev => { const v = ev.target.value; ev.target.value = d.statut; if (v !== d.statut) modaleStatut(d, v, recharger); };
    $('#c-resp').onchange = async ev => { try { const r = await api('api_modifierDemande', d.id, { responsable: ev.target.value }, true); await recharger(ev.target.value ? 'Demande attribuée à ' + nomDe(ev.target.value) + '.' : 'Attribution retirée.', r); } catch (x) { erreur(x); } };
    $('#c-ech').onchange = async ev => { if (!ev.target.value) return; try { const r = await api('api_modifierDemande', d.id, { echeance: ev.target.value }, true); await recharger('Échéance modifiée.', r); } catch (x) { erreur(x); } };
    const bi = $('#b-image');
    const CS = $('#c-sel-f') ? brancherFichiers(el, 'c-sel-f', { multiple: true, max: 10 }) : null;
    if (bi) bi.onclick = async ev => { occupe(ev.currentTarget, true); try { if (CS && CS.fichiers.length) await envoyerFichiers('demande', d.id, 'selection', CS.fichiers); const r = await api('api_modifierDemande', d.id, { photographe: $('#c-photo').value, autorisations: $('#c-auto').value, credit: $('#c-credit').value, selection_url: $('#c-sel').value.trim() }, true); await recharger('Pôle image mis à jour.', r && r.fiche ? r : null); } catch (x) { erreur(x); occupe(ev.currentTarget, false); } };
  } else {
    const bv = $('#b-valider'), bm = $('#b-modif');
    if (bv) bv.onclick = async ev => { occupe(ev.currentTarget, true); try { const r = await api('api_decisionValidation', d.id, 'ok', '', true); await recharger('Merci ! La demande est terminée.', r); } catch (x) { erreur(x); occupe(ev.currentTarget, false); } };
    if (bm) bm.onclick = () => {
      const m = modale('Demander une modification', '<div class="form-ligne"><label for="m-txt">Que faut-il modifier ?</label><textarea class="champ" id="m-txt" placeholder="Soyez le plus précis possible : texte, date, couleur, photo…"></textarea></div>', '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="m-ok">' + ic('send') + 'Envoyer</button>');
      m.querySelector('#m-ok').onclick = async ev => { const txt = m.querySelector('#m-txt').value.trim(); if (!txt) return m.querySelector('#m-txt').focus(); occupe(ev.currentTarget, true); try { const r = await api('api_decisionValidation', d.id, 'modif', txt, true); fermerModale(); await recharger('Demande de modification envoyée.', r); } catch (x) { erreur(x); occupe(ev.currentTarget, false); } };
    };
  }
}

function modaleStatut(d, cible, recharger) {
  const s = statut(cible), notif = s.notifier;
  const prev = notif ? '' : ' (ce statut n\'envoie pas d\'e-mail au demandeur, sauf si vous écrivez un message)';
  const conf = Object.assign({}, {
    nouvelle: { titre: 'Passer à « ' + s.label + ' »', txt: 'La demande revient à une étape d\'arrivée.' + prev, msg: 'Message au demandeur (facultatif)', req: false },
    archivee: { titre: 'Archiver', txt: 'La demande sort des listes courantes (onglet « Archivées »). Rien n\'est supprimé.', msg: 'Note (facultatif)', req: false },
    en_cours: { titre: classe(d.statut) === 'nouvelle' ? 'Prendre en charge' : 'Passer à « ' + s.label + ' »', txt: notif ? 'Le demandeur est prévenu que sa demande avance.' : 'Changement de statut.' + prev, msg: 'Message au demandeur (facultatif)', req: false },
    attente: { titre: 'Demander une information', txt: 'Le demandeur reçoit votre question par e-mail et peut répondre dans l\'application.', msg: 'Votre question', req: true },
    a_valider: { titre: 'Envoyer pour validation', txt: 'Le demandeur reçoit la proposition et peut la valider ou demander une modification.', msg: 'Message (facultatif)', req: false, liv: true },
    terminee: { titre: 'Marquer comme terminée', txt: 'Le demandeur reçoit le lien du livrable.', msg: 'Message (facultatif)', req: false, liv: true },
    annulee: { titre: 'Réorienter ou annuler', txt: 'Expliquez simplement pourquoi (ou vers qui la demande est orientée) : le demandeur reçoit ce message.', msg: 'Explication', req: true },
  }[s.classe] || { titre: s.label, txt: '', msg: 'Message (facultatif)', req: false });
  if (s.classe !== 'nouvelle' && s.classe !== 'archivee' && s.classe !== 'en_cours') conf.titre = conf.titre + (s.label && conf.titre.indexOf(s.label) < 0 ? ' — ' + s.label : '');
  const corps = '<p class="muted">' + conf.txt + '</p>' +
    (conf.liv ? '<div class="form-ligne"><label for="m-liv">Lien du livrable</label><input class="champ" id="m-liv" type="url" placeholder="Lien Canva, Drive…" value="' + h(d.livrable_url) + '"><div class="aide">' + (fonction('fichiers_demandes') ? 'Ou déposez le fichier : <label class="btn petit" style="margin-left:6px">' + ic('upload') + 'Choisir un fichier<input type="file" id="m-fic" hidden></label> <span id="m-fic-nom" class="petit"></span>' : 'Dépôt de fichier indisponible (Drive non configuré) : collez un lien.') + '</div></div>' : '') +
    '<div class="form-ligne"><label for="m-msg">' + conf.msg + (conf.req ? ' <span class="req">*</span>' : '') + '</label><textarea class="champ" id="m-msg"></textarea></div>';
  const m = modale(conf.titre, corps, '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="m-ok">' + ic('check') + 'Confirmer</button>');
  let fichier = null;
  const fi = m.querySelector('#m-fic');
  if (fi) fi.onchange = () => { fichier = fi.files[0] || null; m.querySelector('#m-fic-nom').textContent = fichier ? fichier.name : ''; };
  m.querySelector('#m-ok').onclick = async ev => {
    const msg = m.querySelector('#m-msg').value.trim();
    if (conf.req && !msg) return m.querySelector('#m-msg').focus();
    occupe(ev.currentTarget, true);
    try {
      let liv = conf.liv ? m.querySelector('#m-liv').value.trim() : undefined;
      if (fichier) {
        if (fichier.size > 10 * 1024 * 1024) throw { message: 'Fichier trop lourd (10 Mo maximum).' };
        const r = await api('api_televerser', d.id, await lireFichier(fichier), true);
        liv = r.livrable_url;
      }
      if (conf.liv && s.classe === 'a_valider' && !liv) throw { message: 'Ajoutez le lien ou le fichier de la proposition.' };
      const patch = { statut: cible, message: msg };
      if (liv !== undefined) patch.livrable_url = liv;
      const rf = await api('api_modifierDemande', d.id, patch, true);
      fermerModale();
      await recharger('Statut : ' + s.label + '. Le demandeur est prévenu.', rf);
    } catch (x) { erreur(x); occupe(ev.currentTarget, false); }
  };
}

// ================================================================ NOUVELLE DEMANDE
// Brouillon de la demande en cours : gardé dans l'onglet (sessionStorage), repris après une erreur, un changement de page
// ou une reconnexion ; effacé à l'envoi, à l'abandon et à la déconnexion volontaire. Les fichiers joints ne sont pas gardés.
const CLE_BROUILLON = 'centrecom_brouillon';
function sauverBrouillon() { try { if (S.nd && !S.nd.fini && S.nd.type) sessionStorage.setItem(CLE_BROUILLON, JSON.stringify({ e: moi().email, type: S.nd.type, v: S.nd.v, bid: S.nd.bid || '', copie: S.nd.copie || '', sale: !!S.nd.sale })); } catch (e) { } }
function lireBrouillon() { try { const b = JSON.parse(sessionStorage.getItem(CLE_BROUILLON) || 'null'); return b && S.ses && b.e === moi().email && S.ses.types.some(t => t.code === b.type) ? b : null; } catch (e) { return null; } }
function effacerBrouillon() { try { sessionStorage.removeItem(CLE_BROUILLON); } catch (e) { } }
const brouillonRempli = N => !!(N && N.v && ['titre', 'description'].some(k => String(N.v[k] || '').trim()));
function vNouvelle(el) {
  if (!S.nd || S.nd.fini) { const b = lireBrouillon(); S.nd = b ? { etape: 2, type: b.type, v: b.v || {}, fichiers: [], repris: true, bid: b.bid || '', copie: b.copie || '', sale: !!b.sale } : { etape: 1, type: null, v: {}, fichiers: [] }; }
  if (S.route.depuis && S.route.depuis !== 'nouvelle' && S.nd.etape === 2 && brouillonRempli(S.nd)) S.nd.repris = true;
  S.route.depuis = 'nouvelle';
  const N = S.nd, u = moi();
  if (N.etape === 1) {
    el.innerHTML = '<div class="etapes"><div class="fait"></div><div></div><div></div></div>' + entete('Nouvelle demande · étape 1 sur 3', 'De quoi avez-vous besoin ?') +
      ((N.v.photos || []).length ? '<div class="indice info" style="margin:0 0 14px">' + ic('image') + '<span>' + pluriel(N.v.photos.length, 'photo de la photothèque sera jointe', 'photos de la photothèque seront jointes') + ' à cette demande.</span></div>' : '') +
      (brouillonsServeur().length ? '<div class="carte" id="n-brouillons" style="margin-bottom:16px"><div class="tete"><h2>Reprendre un brouillon</h2></div><div class="corps">' + listeBrouillonsHtml() + '</div></div>' : '') +
      (modelesDemande().length ? '<div class="carte" id="n-modeles" style="margin-bottom:16px"><div class="tete"><h2>Partir d\'un de mes modèles</h2></div><div class="corps">' + listeModelesHtml() + '</div></div>' : '') +
      '<div class="types">' + S.ses.types.map(t => '<button class="type" data-type="' + h(t.code) + '"><span class="ico">' + ic(ICONE_TYPE[t.code] || 'file') + '</span><b>' + h(t.libelle) + '</b><span class="desc">' + h(t.description) + '</span><span class="delai">' + ic('clock') + 'Délai conseillé : ' + t.delai + ' jours</span></button>').join('') + '</div>' +
      '<p class="petit muted" style="margin-top:18px">' + ic('info') + ' ' + h(CFG().textes.formulaire_aide) + ' ' + lienAide('Demandes de communication', 'Questions fréquentes sur les demandes') + '</p>';
    el.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { N.type = b.dataset.type; N.etape = 2; if (!N.v.ul) N.v.ul = u.ul || ''; vNouvelle(el); window.scrollTo(0, 0); });
    const zb = $('#n-brouillons'); if (zb) brancherBrouillons(zb, () => vNouvelle(el));
    const zm = $('#n-modeles'); if (zm) brancherModeles(zm, () => vNouvelle(el));
    return;
  }
  const t = typeDe(N.type), CH = CFG().demandes.champs;
  if (N.etape === 2) {
    const oblig = k => (t.obligatoires || []).indexOf(k) > -1;
    const telMode = CFG().demandes.telephone;
    const champ = (k) => {
      const c = CH[k]; if (!c) return '';
      const v = N.v[k];
      const req = oblig(k) ? ' <span class="req">*</span>' : '';
      const aide = c.aide && c.type !== 'text' ? '<div class="aide">' + h(c.aide) + '</div>' : '';
      if (c.type === 'text') return '<div class="form-ligne"><label for="n-' + k + '">' + h(c.label) + req + '</label><input class="champ" id="n-' + k + '" data-k="' + k + '" value="' + h(v || '') + '" placeholder="' + h(c.aide || '') + '">' + aide + '</div>';
      if (c.type === 'date') return '<div class="form-ligne"><label for="n-' + k + '">' + h(c.label) + req + '</label><input class="champ" type="date" id="n-' + k + '" data-k="' + k + '" value="' + h(v || '') + '" min="' + auj() + '">' + aide + '</div>';
      if (c.type === 'textarea') return '<div class="form-ligne"><label for="n-' + k + '">' + h(c.label) + req + '</label><textarea class="champ" id="n-' + k + '" data-k="' + k + '">' + h(v || '') + '</textarea>' + aide + '</div>';
      if (c.type === 'select') return '<div class="form-ligne"><label for="n-' + k + '">' + h(c.label) + req + '</label><select class="champ" id="n-' + k + '" data-k="' + k + '"><option value="">Choisir…</option>' + c.options.map(o => '<option' + (o === v ? ' selected' : '') + '>' + h(o) + '</option>').join('') + '</select></div>';
      if (c.type === 'chips') return '<div class="form-ligne"><span class="lab">' + h(c.label) + req + '</span><div class="puces" data-chips="' + k + '">' + c.options.map(o => '<label><input type="checkbox" value="' + h(o) + '"' + ((v || []).includes(o) ? ' checked' : '') + '><span>' + h(o) + '</span></label>').join('') + '</div></div>';
      if (c.type === 'files' && !fonction('fichiers_demandes')) return '<div class="form-ligne"><span class="lab">' + h(c.label) + '</span>' + nonConfigure('fichiers_demandes') + '</div>';
      if (c.type === 'files') return '<div class="form-ligne"><span class="lab">' + h(c.label) + '</span><label class="depot" id="n-depot">' + ic('upload') + '<div><b>Glissez vos fichiers ici</b> ou cliquez pour choisir</div><div class="petit">' + h(c.aide || '') + '</div><input type="file" id="n-fic" multiple hidden></label><ul class="fichiers" id="n-liste"></ul></div>';
      if (c.type === 'consent') return '<div class="form-ligne" id="bloc-consent"><span class="lab">' + h(c.label) + '</span><label class="consent"><input type="checkbox" id="n-consent"' + (N.v.droit_image ? ' checked' : '') + '><span>' + h(CFG().textes.droit_image_consentement) + '</span></label><div class="aide">' + h(CFG().textes.droit_image_aide) + '</div></div>';
      return '';
    };
    const specifiques = t.champs.filter(k => k !== 'date_action');
    el.innerHTML = '<div class="etapes"><div class="fait"></div><div class="fait"></div><div></div></div>' +
      '<button class="retour" id="n-retour">' + ic('left') + 'Changer de type</button>' +
      entete('Nouvelle demande · étape 2 sur 3', h(t.libelle)) +
      (N.copie ? '<div class="indice info form-demande" style="margin:0 0 14px">' + ic('copy') + '<span>Copie de la demande ' + h(N.copie) + ' : vérifiez le titre, les dates et les fichiers à joindre avant d\'envoyer.</span></div>' : '') +
      (N.bid ? '<div class="indice ok form-demande" style="margin:0 0 14px" id="n-info-brouillon">' + ic('check') + '<span>Brouillon enregistré sur votre compte : retrouvez-le sur l\'accueil, sur n\'importe quel appareil.</span></div>' : '') +
      (N.repris && !N.depuisBrouillon ? '<div class="indice info form-demande" style="margin:0 0 14px">' + ic('info') + '<span>Votre demande en cours a été conservée : vous reprenez où vous en étiez' + (N.fichiers.length ? '' : ' (les fichiers éventuels sont à joindre de nouveau)') + '. <a href="#" id="n-zero">Recommencer à zéro</a></span></div>' : '') +
      '<div class="form-demande"><div class="carte"><div class="corps">' +
      '<div class="form-ligne"><label for="n-titre">Titre de l\'action ou du sujet <span class="req">*</span></label><input class="champ" id="n-titre" value="' + h(N.v.titre || '') + '" placeholder="Ex. : Collecte alimentaire de printemps à Bellac" maxlength="120"></div>' +
      '<div class="form-2"><div class="form-ligne"><label for="n-ul">Unité locale ou structure <span class="req">*</span></label><select class="champ" id="n-ul"><option value="">Choisir…</option>' + S.ses.ul.map(x => '<option' + (x === N.v.ul ? ' selected' : '') + '>' + h(x) + '</option>').join('') + '</select></div>' +
      (!u.nom ? '<div class="form-ligne"><label for="n-nom">Votre nom <span class="req">*</span></label><input class="champ" id="n-nom" value="' + h(N.v.nom || '') + '" autocomplete="name"></div>' : '') +
      (telMode !== 'masque' ? '<div class="form-ligne"><label for="n-tel">Téléphone' + (telMode === 'obligatoire' ? ' <span class="req">*</span>' : ' (facultatif)') + '</label><input class="champ" id="n-tel" type="tel" value="' + h(N.v.tel || '') + '" autocomplete="tel"></div>' : '') + '</div>' +
      '<div class="form-ligne"><label for="n-desc">Décrivez votre demande <span class="req">*</span></label><textarea class="champ" id="n-desc" placeholder="Qui, quoi, où, quand, pourquoi. Ce que vous imaginez.">' + h(N.v.description || '') + '</textarea></div>' +
      (t.champs.includes('date_action') ? champ('date_action') : '') +
      specifiques.map(champ).join('') +
      '<div class="form-ligne" style="margin-bottom:0"><label for="n-ech">Pour quand avez-vous besoin du support ? <span class="req">*</span></label><input class="champ" type="date" id="n-ech" value="' + h(N.v.echeance || '') + '" min="' + auj() + '" style="max-width:240px"><div id="n-indice"></div></div>' +
      (CFG().demandes.urgence_declaree ? '<div class="form-ligne urgence-bloc" style="margin:16px 0 0"><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:0"><input type="checkbox" id="n-urg"' + (N.v.urgence ? ' checked' : '') + ' style="width:18px;height:18px;accent-color:var(--rouge);margin-top:2px"><span><b>C\'est urgent</b><span class="petit muted" style="display:block">Une contrainte extérieure impose ce délai (date fixée par un partenaire, une mairie…).</span></span></label>' +
        '<div id="n-urg-bloc" style="margin-top:10px;' + (N.v.urgence ? '' : 'display:none') + '"><label for="n-urg-motif">Pourquoi est-ce urgent ? <span class="req">*</span></label><input class="champ" id="n-urg-motif" value="' + h(N.v.urgence_motif || '') + '" maxlength="300"></div></div>' : '') +
      '<div id="n-photos">' + photosChoisiesHtml(N) + '</div>' +
      (CFG().demandes.lien_drive ? '<div class="form-ligne" style="margin:16px 0 0"><label for="n-lien">Lien vers vos documents (facultatif)</label><input class="champ" id="n-lien" type="url" value="' + h(N.v.lien || '') + '" placeholder="https://drive.google.com/…"><div class="aide">Pour des fichiers lourds ou nombreux : déposez-les dans un dossier Drive partagé avec l\'équipe et collez le lien ici.</div></div>' : '') +
      '</div></div>' +
      '<div class="form-pied"><button class="btn" id="n-annuler">Annuler</button><span class="form-pied-droite">' + (fonctionDispo('api_brouillon') ? '<button class="btn" id="n-brouillon">' + ic('pen') + 'Enregistrer le brouillon</button>' : '') + '<button class="btn principal" id="n-suite">Vérifier et envoyer ' + ic('right') + '</button></span></div></div>';

    const lire = () => {
      N.v.titre = $('#n-titre').value; N.v.ul = $('#n-ul').value; N.v.description = $('#n-desc').value; N.v.echeance = $('#n-ech').value;
      if ($('#n-nom')) N.v.nom = $('#n-nom').value; if ($('#n-tel')) N.v.tel = $('#n-tel').value;
      el.querySelectorAll('[data-k]').forEach(x => N.v[x.dataset.k] = x.value);
      el.querySelectorAll('[data-chips]').forEach(x => N.v[x.dataset.chips] = Array.from(x.querySelectorAll('input:checked')).map(i => i.value));
      if ($('#n-consent')) N.v.droit_image = $('#n-consent').checked;
      if ($('#n-urg')) { N.v.urgence = $('#n-urg').checked; N.v.urgence_motif = $('#n-urg-motif').value; }
      if ($('#n-lien')) N.v.lien = $('#n-lien').value.trim();
    };
    if ($('#n-urg')) $('#n-urg').onchange = ev => { $('#n-urg-bloc').style.display = ev.target.checked ? '' : 'none'; if (ev.target.checked) $('#n-urg-motif').focus(); };
    const indice = () => {
      const v = $('#n-ech').value, z = $('#n-indice');
      if (!v) { z.innerHTML = '<div class="indice info">' + ic('info') + '<span>Délai conseillé pour ce type de demande : <b>' + t.delai + ' jours</b>. Idéalement, pas avant le ' + fmt(ajouterJours(auj(), t.delai), { day: 'numeric', month: 'long' }) + '.</span></div>'; return; }
      const j = joursAvant(v);
      if (j >= t.delai) z.innerHTML = '<div class="indice ok">' + ic('check') + '<span>Parfait : ' + j + ' jours, c\'est dans les délais.</span></div>';
      else if (j >= CFG().demandes.seuil_urgent) z.innerHTML = '<div class="indice attention">' + ic('clock') + '<span>Délai court : ' + j + ' jours pour ' + t.delai + ' conseillés. Nous ferons au mieux.</span></div>';
      else z.innerHTML = '<div class="indice alerte">' + ic('alert') + '<span>Demande urgente : ' + j + ' jour(s) seulement. Nous ne pourrons peut-être pas y répondre à temps.</span></div>';
    };
    indice();
    $('#n-ech').oninput = indice;
    const da = $('#n-date_action');
    if (da) da.onchange = () => { if (!$('#n-ech').value && da.value) { const cible = t.pole === 'image' ? da.value : ajouterJours(da.value, -3); $('#n-ech').value = joursAvant(cible) >= 0 ? cible : auj(); indice(); } };

    // Fichiers
    const liste = $('#n-liste'), depot = $('#n-depot');
    const majFichiers = () => {
      if (!liste) return;
      liste.innerHTML = N.fichiers.map((f, i) => '<li>' + ic('file') + '<span class="nom">' + h(f.name) + '</span><span class="petit muted">' + (f.size / 1048576).toFixed(1) + ' Mo</span><button class="btn fantome btn-icone" data-suppr="' + i + '" aria-label="Retirer">' + ic('x') + '</button></li>').join('');
      liste.querySelectorAll('[data-suppr]').forEach(b => b.onclick = () => { N.fichiers.splice(+b.dataset.suppr, 1); majFichiers(); });
    };
    const ajouter = fl => {
      Array.from(fl).forEach(f => {
        if (N.fichiers.length >= 5) return toast('5 fichiers maximum.', true);
        if (f.size > 10 * 1024 * 1024) return toast(f.name + ' dépasse 10 Mo.', true);
        N.fichiers.push(f);
      });
      majFichiers();
    };
    if (depot) {
      $('#n-fic').onchange = ev => { ajouter(ev.target.files); ev.target.value = ''; };
      ['dragenter', 'dragover'].forEach(x => depot.addEventListener(x, ev => { ev.preventDefault(); depot.classList.add('survol'); }));
      ['dragleave', 'drop'].forEach(x => depot.addEventListener(x, ev => { ev.preventDefault(); depot.classList.remove('survol'); }));
      depot.addEventListener('drop', ev => ajouter(ev.dataTransfer.files));
      majFichiers();
    }
    // Saisie gardée en continu : rien n'est perdu en changeant de page, après une erreur ou une session expirée
    const form = el.querySelector('.form-demande');
    ['input', 'change'].forEach(x => form.addEventListener(x, () => { lire(); N.sale = true; sauverBrouillon(); }));
    const bb = $('#n-brouillon');
    if (bb) bb.onclick = async () => { lire(); if (!brouillonRempli(N)) { toast('Écrivez au moins un titre ou une description avant d\'enregistrer le brouillon.', true); return $('#n-titre').focus(); } occupe(bb, true); try { await enregistrerBrouillonServeur(N); sauverBrouillon(); } catch (x) { erreur(x); } occupe(bb, false); };
    N.repris = false; N.depuisBrouillon = false;
    const brancherPhotosChoisies = () => { const z = $('#n-photos'); if (!z) return; z.innerHTML = photosChoisiesHtml(N); z.querySelectorAll('[data-retirer-photo]').forEach(b => b.onclick = () => { N.v.photos = (N.v.photos || []).filter(x => x !== b.dataset.retirerPhoto); sauverBrouillon(); brancherPhotosChoisies(); }); chargerVignettes(N.v.photos || []); };
    brancherPhotosChoisies();
    const zero = $('#n-zero'); if (zero) zero.onclick = ev => { ev.preventDefault(); if (!confirm('Effacer la demande en cours et recommencer ?')) return; effacerBrouillon(); S.nd = null; vNouvelle(el); };
    $('#n-retour').onclick = () => { lire(); sauverBrouillon(); N.etape = 1; vNouvelle(el); };
    $('#n-annuler').onclick = async () => {
      lire();
      if (N.bid) { if (!confirm('Fermer cette demande ? Votre brouillon enregistré est gardé (supprimez-le depuis l\'accueil si vous n\'en avez plus besoin).')) return; if (N.sale) { try { await enregistrerBrouillonServeur(N, true); } catch (x) { } } }
      else if (brouillonRempli(N) && !confirm('Abandonner cette demande ? Ce que vous avez saisi sera effacé.')) return;
      N.sale = false; effacerBrouillon(); S.nd = null; go('accueil');
    };
    $('#n-suite').onclick = () => {
      lire();
      const manque = [];
      if (!N.v.titre.trim()) manque.push(['#n-titre', 'le titre']);
      if (!N.v.ul) manque.push(['#n-ul', 'l\'unité locale']);
      if ($('#n-nom') && !N.v.nom.trim()) manque.push(['#n-nom', 'votre nom']);
      if (!N.v.description.trim()) manque.push(['#n-desc', 'la description']);
      (t.obligatoires || []).forEach(k => { const c = CH[k]; if (!c || c.type === 'files' || c.type === 'consent') return; const x = N.v[k]; if (x === undefined || x === '' || (Array.isArray(x) && !x.length)) manque.push([c.type === 'chips' ? '[data-chips="' + k + '"] input' : '#n-' + k, c.label.toLowerCase()]); });
      if (telMode === 'obligatoire' && !String(N.v.tel || '').trim()) manque.push(['#n-tel', 'le téléphone']);
      if (!N.v.echeance) manque.push(['#n-ech', 'la date de besoin']);
      if (N.fichiers.length && t.champs.includes('droit_image') && !N.v.droit_image) manque.push(['#n-consent', 'la confirmation du droit à l\'image']);
      if (N.v.urgence && !String(N.v.urgence_motif || '').trim()) manque.push(['#n-urg-motif', 'la raison de l\'urgence']);
      if (N.v.lien && !/^https:\/\//i.test(N.v.lien)) manque.push(['#n-lien', 'un lien valide (commençant par https://)']);
      if (manque.length) { toast('Il manque ' + manque.map(x => x[1]).join(', ') + '.', true); marquerInvalides(manque.map(x => x[0])); const f = $(manque[0][0]); if (f) { f.focus(); f.scrollIntoView({ block: 'center', behavior: 'smooth' }); } return; }
      N.etape = 3; vNouvelle(el); window.scrollTo(0, 0);
    };
    return;
  }
  if (N.etape === 3) {
    const lignes = [['Type', t.libelle], ['Titre', N.v.titre], ['UL / structure', N.v.ul], ['Description', N.v.description]];
    t.champs.forEach(k => { const c = CH[k]; const v = N.v[k]; if (!c || k === 'fichiers' || k === 'droit_image') return; if (v && (!Array.isArray(v) || v.length)) lignes.push([c.label, c.type === 'date' ? fmt(v, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : Array.isArray(v) ? v.join(', ') : v]); });
    lignes.push(['Pour le', fmt(N.v.echeance, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })]);
    if (N.v.urgence) lignes.push(['Urgence déclarée', N.v.urgence_motif]);
    if (N.v.lien) lignes.push(['Lien vers vos documents', N.v.lien]);
    if (N.fichiers.length) lignes.push(['Fichiers', N.fichiers.map(f => f.name).join(', ')]);
    if ((N.v.photos || []).length) lignes.push(['Photos de la photothèque', N.v.photos.map(id => titrePhoto(photoParId(id) || { titre: id })).join(', ')]);
    const j = joursAvant(N.v.echeance);
    el.innerHTML = '<div class="etapes"><div class="fait"></div><div class="fait"></div><div class="fait"></div></div>' + entete('Nouvelle demande · étape 3 sur 3', 'Vérifiez avant d\'envoyer') +
      '<div class="form-demande"><div class="carte"><div class="corps"><div class="infos" style="grid-template-columns:1fr">' + lignes.map(l => '<div><div class="k">' + h(l[0]) + '</div><div class="v texte-long">' + h(l[1]) + '</div></div>').join('') + '</div>' +
      (j < t.delai && !N.v.urgence ? '<div class="indice ' + (j < CFG().demandes.seuil_urgent ? 'alerte' : 'attention') + '" style="margin-top:16px">' + ic('clock') + '<span>Délai de ' + j + ' jour(s) pour ' + t.delai + ' conseillés : la demande sera marquée « ' + (j < CFG().demandes.seuil_urgent ? 'urgente' : 'délai court') + ' ».</span></div>' : '') +
      (N.v.urgence ? '<div class="indice attention" style="margin-top:16px">' + ic('alert') + '<span>Urgence déclarée : l\'équipe communication la verra en priorité et vous recontactera si besoin.</span></div>' : '') +
      '</div></div><div id="n-progres" class="petit muted" style="margin-top:10px"></div>' +
      '<div style="display:flex;justify-content:space-between;gap:10px;margin-top:16px"><button class="btn" id="n-modifier">' + ic('left') + 'Modifier</button><button class="btn principal btn-cta" id="n-envoyer">' + ic('send') + 'Envoyer la demande</button></div></div>';
    $('#n-modifier').onclick = () => { N.etape = 2; vNouvelle(el); };
    $('#n-envoyer').onclick = async ev => {
      occupe(ev.currentTarget, true); $('#n-modifier').disabled = true;
      const details = {};
      t.champs.forEach(k => { if (k !== 'fichiers' && N.v[k] !== undefined && N.v[k] !== '') details[k] = N.v[k]; });
      details.fichiers_prevus = N.fichiers.length > 0;
      if (N.v.urgence) { details.urgence = 'oui'; details.urgence_motif = String(N.v.urgence_motif || '').trim(); }
      if (N.v.lien) details.lien = N.v.lien;
      if ((N.v.photos || []).length) details.photos = N.v.photos.slice(0, 20);
      try {
        const d = await api('api_creerDemande', { type: t.code, titre: N.v.titre, ul: N.v.ul, description: N.v.description, echeance: N.v.echeance, demandeur_nom: N.v.nom || u.nom, telephone: N.v.tel || '', details: details, brouillon: N.bid || '' });
        if (N.bid) prefs().brouillons = brouillonsServeur().filter(b => b.id !== N.bid);   // supprimé par le serveur avec l'envoi
        N.sale = false;
        if (N.v.nom && !u.nom) u.nom = N.v.nom;
        for (let i = 0; i < N.fichiers.length; i++) {
          $('#n-progres').textContent = 'Envoi des fichiers : ' + (i + 1) + ' / ' + N.fichiers.length + '…';
          try { await api('api_televerser', d.id, await lireFichier(N.fichiers[i]), false); } catch (x) { toast('Le fichier ' + N.fichiers[i].name + ' n\'a pas pu être envoyé.', true); }
        }
        N.fini = true; oublierDemandes(); S.cal = null; effacerBrouillon();
        el.innerHTML = '<div class="carte succes"><div class="rond">' + ic('check') + '</div><h1>Demande envoyée</h1><div class="num">' + h(d.id) + '</div>' +
          '<p class="muted" style="max-width:460px;margin:0 auto 18px">' + h(CFG().textes.confirmation_texte) + '</p>' +
          '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-go="demande:' + h(d.id) + '">Suivre ma demande</button><button class="btn principal" id="n-autre">' + ic('plus') + 'Faire une autre demande</button></div></div>';
        $('#n-autre').onclick = () => { S.nd = null; vNouvelle(el); };
        chargerDemandes().then(majCompteNav);
      } catch (x) { erreur(x); occupe(ev.currentTarget, false); $('#n-modifier').disabled = false; }
    };
  }
}

// ================================================================ CALENDRIER
function evenementsDuJour(evs, iso) { return evs.filter(e => e.date === iso || (e.date_fin && e.date <= iso && e.date_fin >= iso)); }
function styleEvt(e) { const c = coulCat(e.categorie); return 'background:' + c + '26;border-left-color:' + c + ';color:var(--texte)'; }
function boutonEvt(e) { return '<button class="evt' + (e.statut === 'Idée' ? ' idee' : '') + (e.statut === 'Annulé' ? ' annule' : '') + '" style="' + styleEvt(e) + '" data-evt="' + h(e.source + ':' + e.id) + '" title="' + h(e.titre) + '">' + h(e.titre) + '</button>'; }

async function vCalendrier(el) {
  const C = S.ui.cal;
  if (!C.ref) C.ref = auj();
  el.innerHTML = entete('Planifier', 'Calendrier éditorial') + '<div class="squelette" style="height:520px"></div>';
  await chargerCal();
  function dessiner() {
    const evs = (S.cal || []).filter(e => !C.off[e.categorie]).filter(e => !C.ul || e.ul === C.ul).filter(e => !C.resp || e.responsable === C.resp).filter(e => !C.st || e.statut === C.st);
    const stDispo = Array.from(new Set((S.cal || []).map(e => e.statut).filter(Boolean))).sort();
    const optsF = (arr, val, vide) => '<option value="">' + vide + '</option>' + arr.map(x => '<option value="' + h(x[0]) + '"' + (x[0] === val ? ' selected' : '') + '>' + h(x[1]) + '</option>').join('');
    const filtresCal = '<div class="filtres" style="margin-top:-4px"><select class="champ" id="cf-ul" aria-label="UL">' + optsF(S.ses.ul.map(x => [x, x]), C.ul, 'Toutes les UL') + '</select>' +
      '<select class="champ" id="cf-resp" aria-label="Responsable">' + optsF(S.ses.equipe.map(x => [x.email, x.nom]), C.resp, 'Tous les responsables') + '</select>' +
      '<select class="champ" id="cf-st" aria-label="Statut">' + optsF(stDispo.map(x => [x, x]), C.st, 'Tous les statuts') + '</select>' +
      (C.ul || C.resp || C.st ? '<button class="btn petit fantome" id="cf-raz">' + ic('x') + 'Effacer les filtres</button>' : '') + '</div>';
    const ref = dateDe(C.ref);
    let titre = '', corps = '';
    if (C.vue === 'mois') {
      titre = ref.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const premier = new Date(ref.getFullYear(), ref.getMonth(), 1);
      const debut = new Date(premier); debut.setDate(1 - ((premier.getDay() + 6) % 7));
      let cases = '';
      for (let i = 0; i < 42; i++) {
        const d = new Date(debut); d.setDate(debut.getDate() + i);
        if (i >= 35 && d.getMonth() !== ref.getMonth()) break;
        const iso = isoJour(d), du = evenementsDuJour(evs, iso);
        cases += '<div class="jour' + (d.getMonth() !== ref.getMonth() ? ' hors' : '') + (iso === auj() ? ' auj' : '') + '"><span class="n">' + d.getDate() + '</span>' +
          du.slice(0, 3).map(boutonEvt).join('') + (du.length > 3 ? '<button class="plus-evt" data-jour="' + iso + '">+ ' + (du.length - 3) + ' autre(s)</button>' : '') + '</div>';
      }
      corps = '<div class="mois">' + ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map(j => '<div class="jsem">' + j + '</div>').join('') + cases + '</div>';
    } else if (C.vue === 'semaine') {
      const debut = new Date(ref); debut.setDate(ref.getDate() - ((ref.getDay() + 6) % 7));
      const fin = new Date(debut); fin.setDate(debut.getDate() + 6);
      titre = 'Semaine du ' + debut.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
      let cols = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date(debut); d.setDate(debut.getDate() + i);
        const iso = isoJour(d), du = evenementsDuJour(evs, iso);
        cols += '<div class="col' + (iso === auj() ? ' auj' : '') + '"><h4>' + d.toLocaleDateString('fr-FR', { weekday: 'long' }) + '<b>' + d.getDate() + '</b></h4>' + (du.length ? du.map(boutonEvt).join('') : '<span class="tres-petit muted">—</span>') + '</div>';
      }
      corps = '<div class="semaine">' + cols + '</div>';
    } else {
      titre = 'À venir';
      const aVenir = evs.filter(e => e.date >= auj() || (e.date_fin && e.date_fin >= auj())).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 120);
      const groupes = {};
      aVenir.forEach(e => { const k = e.date.slice(0, 7); (groupes[k] = groupes[k] || []).push(e); });
      corps = '<div class="agenda-liste">' + (Object.keys(groupes).length ? Object.keys(groupes).map(k => '<div class="groupe"><h3>' + dateDe(k + '-01').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) + '</h3>' + groupes[k].map(ligneAgenda).join('') + '</div>').join('') : videEtat('calendar', 'Rien de prévu.')) + '</div>';
    }
    el.innerHTML = entete('Planifier', 'Calendrier éditorial', peut('calendrier_modifier') ? '<button class="btn principal" id="c-ajout">' + ic('plus') + 'Ajouter au calendrier</button>' : '') +
      '<div class="cal-barre">' + (C.vue !== 'liste' ? '<button class="btn btn-icone" id="c-prec" aria-label="Précédent">' + ic('left') + '</button><button class="btn btn-icone" id="c-suiv" aria-label="Suivant">' + ic('right') + '</button><button class="btn petit" id="c-auj">Aujourd\'hui</button>' : '') +
      '<h2>' + h(titre) + '</h2><span style="flex:1"></span><div class="segment" role="tablist">' + [['mois', 'Mois'], ['semaine', 'Semaine'], ['liste', 'Liste']].map(x => '<button data-vue="' + x[0] + '" class="' + (C.vue === x[0] ? 'actif' : '') + '">' + x[1] + '</button>').join('') + '</div></div>' +
      '<div class="legende">' + CFG().calendrier.categories.map(x => x.nom).concat(['Échéance', 'Réservation de matériel'].filter(n => !CFG().calendrier.categories.some(x => x.nom === n) && (S.cal || []).some(e => e.categorie === n))).map(c => '<button data-cat="' + h(c) + '" class="' + (C.off[c] ? 'off' : '') + '"><i style="background:' + coulCat(c) + '"></i>' + h(c) + '</button>').join('') + '</div>' + filtresCal + corps;
    [['#cf-ul', 'ul'], ['#cf-resp', 'resp'], ['#cf-st', 'st']].forEach(x => { $(x[0]).onchange = ev => { C[x[1]] = ev.target.value; dessiner(); }; });
    if ($('#cf-raz')) $('#cf-raz').onclick = () => { C.ul = C.resp = C.st = ''; dessiner(); };
    el.querySelectorAll('[data-vue]').forEach(b => b.onclick = () => { C.vue = b.dataset.vue; dessiner(); });
    el.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { C.off[b.dataset.cat] = !C.off[b.dataset.cat]; dessiner(); });
    const dec = n => { const d = dateDe(C.ref); if (C.vue === 'mois') { d.setDate(1); d.setMonth(d.getMonth() + n); } else d.setDate(d.getDate() + 7 * n); C.ref = isoJour(d); dessiner(); };
    if ($('#c-prec')) { $('#c-prec').onclick = () => dec(-1); $('#c-suiv').onclick = () => dec(1); $('#c-auj').onclick = () => { C.ref = auj(); dessiner(); }; }
    el.querySelectorAll('[data-jour]').forEach(b => b.onclick = () => { C.ref = b.dataset.jour; C.vue = 'semaine'; dessiner(); });
    brancherAgenda(el);
    const ba = $('#c-ajout'); if (ba) ba.onclick = () => modaleEvenement(null);
  }
  S.ui.cal.redessiner = dessiner;
  dessiner();
}

function ouvrirEvenement(cle) {
  const i = cle.indexOf(':'), src = cle.slice(0, i), id = cle.slice(i + 1);
  const e = (S.cal || []).find(x => x.source === src && x.id === id);
  if (!e) return;
  if (src === 'calendrier' && peut('calendrier_modifier')) return modaleEvenement(e);
  const lignes = [['Date', fmt(e.date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + (e.date_fin && e.date_fin !== e.date ? ' → ' + fmt(e.date_fin, { day: 'numeric', month: 'long' }) : '')], ['Catégorie', e.categorie], ['UL / structure', e.ul], ['Type / canaux', e.canal], ['Responsable', nomDe(e.responsable)], ['Statut', e.statut], ['Notes', e.notes]].filter(x => x[1]);
  modale(e.titre, '<div class="infos" style="grid-template-columns:1fr 1fr">' + lignes.map(l => '<div><div class="k">' + h(l[0]) + '</div><div class="v texte-long">' + h(l[1]) + '</div></div>').join('') + '</div>',
    ((src === 'demande' || src === 'echeance') && e.lisible !== false ? '<button class="btn principal" data-go="demande:' + h(e.id) + '">Ouvrir la demande ' + ic('right') + '</button>'
      : src === 'reservation' ? '<button class="btn principal" id="ev-resa">' + ic('box') + 'Voir les réservations ' + ic('right') + '</button>' : '<button class="btn" data-fermer>Fermer</button>'));
  { const b = document.querySelector('#modale-racine #ev-resa'); if (b) b.onclick = () => { const gestion = peut('reservations_gerer'); if (gestion) { const F = etatMat(); F.g = 'reservations'; } go('materiel', null, { onglet: gestion ? 'gestion' : 'mes' }); }; }
  if (evtEditorial(e)) photosEvenement(document.querySelector('#modale-racine .modale'), cle);
  if (src === 'calendrier' || src === 'demande') projetsLiesHtml(src === 'calendrier' ? 'evenement' : 'demande', id).then(html => { const mo = document.querySelector('#modale-racine .modale .corps'); if (html && mo) mo.insertAdjacentHTML('beforeend', html); });
}

function modaleEvenement(e) {
  const n = !e; e = e || { date: S.ui.cal.ref || auj(), categorie: 'Événement', statut: 'Prévu' };
  const sel = (id, arr, v, vide) => '<select class="champ" id="' + id + '">' + (vide ? '<option value="">' + vide + '</option>' : '') + arr.map(x => { const val = Array.isArray(x) ? x[0] : x, lib = Array.isArray(x) ? x[1] : x; return '<option value="' + h(val) + '"' + (val === v ? ' selected' : '') + '>' + h(lib) + '</option>'; }).join('') + '</select>';
  const m = modale(n ? 'Ajouter au calendrier' : 'Modifier', '<div class="form-ligne"><label for="e-titre">Titre <span class="req">*</span></label><input class="champ" id="e-titre" value="' + h(e.titre || '') + '"></div>' +
    '<div class="form-2"><div class="form-ligne"><label for="e-date">Date <span class="req">*</span></label><input class="champ" type="date" id="e-date" value="' + h(e.date) + '"></div><div class="form-ligne"><label for="e-fin">Fin (si plusieurs jours)</label><input class="champ" type="date" id="e-fin" value="' + h(e.date_fin || '') + '"></div>' +
    '<div class="form-ligne"><label for="e-cat">Catégorie</label>' + sel('e-cat', CFG().calendrier.categories.map(x => x.nom), e.categorie) + '</div><div class="form-ligne"><label for="e-statut">Statut</label>' + sel('e-statut', CFG().calendrier.statuts, e.statut) + '</div>' +
    '<div class="form-ligne"><label for="e-ul">UL / structure</label>' + sel('e-ul', S.ses.ul, e.ul, '—') + '</div><div class="form-ligne"><label for="e-resp">Responsable</label>' + sel('e-resp', S.ses.equipe.map(x => [x.email, x.nom]), e.responsable, '—') + '</div></div>' +
    '<div class="form-ligne"><label for="e-canal">Canaux</label><input class="champ" id="e-canal" value="' + h(e.canal || '') + '" placeholder="Instagram, Facebook, presse, interne…"></div>' +
    '<div class="form-ligne"><label for="e-notes">Notes</label><textarea class="champ" id="e-notes" style="min-height:70px">' + h(e.notes || '') + '</textarea></div>',
    (n ? '' : '<button class="btn danger" id="e-suppr" style="margin-right:auto">' + ic('trash') + 'Supprimer</button>') + '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="e-ok">' + ic('check') + 'Enregistrer</button>');
  if (!n) { photosEvenement(m, 'calendrier:' + e.id); projetsLiesHtml('evenement', e.id).then(html => { const c = m.querySelector('.corps'); if (html && c && document.contains(c)) c.insertAdjacentHTML('beforeend', html); }); }
  const fin = async msg => { fermerModale(); S.cal = deCol(await api('api_calendrier', true)); toast(msg); if (S.route.v === 'calendrier' && S.ui.cal.redessiner) S.ui.cal.redessiner(); else rendre(); };
  m.querySelector('#e-ok').onclick = async ev => {
    const o = { id: e.id, titre: m.querySelector('#e-titre').value, date: m.querySelector('#e-date').value, date_fin: m.querySelector('#e-fin').value, categorie: m.querySelector('#e-cat').value, statut: m.querySelector('#e-statut').value, ul: m.querySelector('#e-ul').value, responsable: m.querySelector('#e-resp').value, canal: m.querySelector('#e-canal').value, notes: m.querySelector('#e-notes').value };
    if (!o.titre.trim() || !o.date) return toast('Titre et date sont obligatoires.', true);
    occupe(ev.currentTarget, true);
    try { await api('api_enregistrerEvenement', o); await fin('Calendrier mis à jour.'); } catch (x) { erreur(x); occupe(ev.currentTarget, false); }
  };
  const bs = m.querySelector('#e-suppr');
  if (bs) bs.onclick = async ev => { if (!confirm('Supprimer « ' + e.titre + ' » du calendrier ?')) return; occupe(ev.currentTarget, true); try { await api('api_supprimerEvenement', e.id); await fin('Supprimé du calendrier.'); } catch (x) { erreur(x); } };
}

// Ajouter : choisir le type, chercher parmi ce que l'on voit déjà, cliquer « Ajouter »
function modaleAjoutProjet(P, apres) {
  const types = PROJET_TYPES.filter(t => t[0] === 'demande' || (t[0] === 'evenement' && peut('calendrier_voir')) || (t[0] === 'ressource' && peut('ressources_voir')) || (t[0] === 'album' && peut('phototheque_voir')) || (t[0] === 'materiel' && peut('materiel_voir')));
  let dernier = P, jeton = 0;
  const m = modale('Ajouter au projet « ' + P.titre + ' »', '<div class="filtres" style="margin-bottom:10px"><select class="champ" id="pa-type" aria-label="Type d\'élément">' + types.map(t => '<option value="' + t[0] + '">' + h(t[1]) + '</option>').join('') + '</select>' +
    '<div class="recherche" style="flex:1">' + ic('search') + '<input class="champ" id="pa-q" type="search" placeholder="Rechercher…" aria-label="Rechercher un élément"></div></div><div id="pa-res" style="max-height:50vh;overflow:auto">' + squelette(2) + '</div>',
    '<button class="btn principal" id="pa-fin">Terminé</button>');
  const deja = () => new Set((dernier.elements || []).map(x => x.t + ':' + x.id));
  const chercher = async () => {
    const t = m.querySelector('#pa-type').value, q = m.querySelector('#pa-q').value, j = ++jeton, z = m.querySelector('#pa-res');
    try {
      const L = await api('api_candidatsProjet', t, q); if (j !== jeton) return;
      const D = deja();
      z.innerHTML = L.length ? '<ul class="liste-suivi compacte">' + L.map(x => '<li class="brouillon-ligne"><span class="ligne-suivi"><span class="quoi"><b>' + h(x.titre) + '</b><span class="petit muted">' + h(x.sous || '') + '</span></span></span>' +
        (D.has(x.t + ':' + x.id) ? '<span class="tres-petit muted">' + ic('check') + ' Dans le projet</span>' : '<button type="button" class="btn petit" data-pa="' + h(x.t) + ':' + h(x.id) + '">' + ic('plus') + 'Ajouter</button>') + '</li>').join('') + '</ul>' : videEtat('search', 'Aucun élément trouvé.', '');
      z.querySelectorAll('[data-pa]').forEach(b => b.onclick = async () => {
        const v = b.dataset.pa, i = v.indexOf(':'); occupe(b, true);
        try { dernier = await api('api_lierProjet', P.id, v.slice(0, i), v.slice(i + 1), false); b.outerHTML = '<span class="tres-petit muted">' + ic('check') + ' Ajouté</span>'; } catch (x) { erreur(x); occupe(b, false); }
      });
    } catch (x) { if (j === jeton) z.innerHTML = videEtat('alert', h(x.message || 'Erreur.'), ''); }
  };
  let minuteur = null;
  m.querySelector('#pa-type').onchange = () => { m.querySelector('#pa-q').value = ''; chercher(); };
  m.querySelector('#pa-q').oninput = () => { clearTimeout(minuteur); minuteur = setTimeout(chercher, 300); };
  m.querySelector('#pa-fin').onclick = () => { fermerModale(); apres(dernier); };
  chercher();
}

function fabriquerGrandeImage(fichier) {

          let q = .85; d = c.toDataURL('image/jpeg', q); while (d.length > 190000 && q > .5) { q -= .08; d = c.toDataURL('image/jpeg', q); }

    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('illisible')); };
    img.src = url;
  });
}
async function preparerPhotoMat(f) {

}

// ---------- Planning : jour / semaine / mois (seulement la période affichée est demandée au serveur) ----------
async function vuePlanning(c, el) {
  const F = S.ui.mat, M = S.mat;
  if (!F.ref) F.ref = auj();
  const ref = dateDe(F.ref);
  let du, au, titre;
  if (F.vue === 'jour') { du = au = F.ref; titre = ref.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  else if (F.vue === 'semaine') { const d = new Date(ref); d.setDate(ref.getDate() - ((ref.getDay() + 6) % 7)); const f = new Date(d); f.setDate(d.getDate() + 6); du = isoJour(d); au = isoJour(f); titre = 'Semaine du ' + d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }); }
  else { const p = new Date(ref.getFullYear(), ref.getMonth(), 1), d = new Date(p); d.setDate(1 - ((p.getDay() + 6) % 7)); const f = new Date(d); f.setDate(d.getDate() + 41); du = isoJour(d); au = isoJour(f); titre = ref.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); }
  const items = M.items.filter(m => m.actif && !m.archive);
  c.innerHTML = '<div class="cal-barre"><button class="btn btn-icone" id="mp-prec" aria-label="Précédent">' + ic('left') + '</button><button class="btn btn-icone" id="mp-suiv" aria-label="Suivant">' + ic('right') + '</button><button class="btn" id="mp-auj">Aujourd\'hui</button>' +
    '<h2>' + h(titre) + '</h2><span style="flex:1"></span><div class="segment" role="tablist">' + [['jour', 'Jour'], ['semaine', 'Semaine'], ['mois', 'Mois']].map(x => '<button data-vue="' + x[0] + '" class="' + (F.vue === x[0] ? 'actif' : '') + '">' + x[1] + '</button>').join('') + '</div></div>' +
    '<div class="filtres" style="margin-top:-4px"><select class="champ" id="mp-mat" aria-label="Matériel"><option value="">Tout le matériel</option>' + items.map(m => '<option value="' + h(m.id) + '"' + (m.id === F.filtre ? ' selected' : '') + '>' + h(m.nom) + '</option>').join('') + '</select>' +
    '<span class="mat-legende">' + pastilleResa('confirmee') + pastilleResa('attente') + '</span></div><div id="mp-corps">' + (PLANNING.has(du + au + F.filtre) ? '' : '<div class="squelette" style="height:360px"></div>') + '</div>';
  const dec = n => { const d = dateDe(F.ref); if (F.vue === 'mois') { d.setDate(1); d.setMonth(d.getMonth() + n); } else d.setDate(d.getDate() + (F.vue === 'jour' ? n : 7 * n)); F.ref = isoJour(d); vuePlanning(c, el); };
  c.querySelector('#mp-prec').onclick = () => dec(-1); c.querySelector('#mp-suiv').onclick = () => dec(1); c.querySelector('#mp-auj').onclick = () => { F.ref = auj(); vuePlanning(c, el); };
  c.querySelectorAll('[data-vue]').forEach(b => b.onclick = () => { F.vue = b.dataset.vue; vuePlanning(c, el); });
  c.querySelector('#mp-mat').onchange = ev => { F.filtre = ev.target.value; vuePlanning(c, el); };
  const cle = du + au + F.filtre;
  c.dataset.planning = cle;   // une réponse arrivée après un changement de période ou de filtre est ignorée
  let L = PLANNING.get(cle);
  if (!L || Date.now() - L.t > 60000) {
    try { L = { t: Date.now(), l: await api('api_planning', du, au, F.filtre) }; PLANNING.set(cle, L); if (PLANNING.size > 20) PLANNING.delete(PLANNING.keys().next().value); }
    catch (x) { if (document.contains(c)) c.querySelector('#mp-corps').innerHTML = '<div class="indice alerte">' + ic('alert') + '<span>' + h(x.message) + '</span></div>'; return; }
  }
  if (!document.contains(c) || c.dataset.planning !== cle) return;
  const resas = L.l, duJour = iso => resas.filter(r => r.debut < iso + 'T24:00' && r.fin > iso + 'T00:00');
  const evt = (r, long) => '<button class="evt mat-evt ' + r.statut + (r.a_moi ? ' moi' : '') + '" data-pr="' + h(r.id) + '" title="' + h(r.materiel_nom + ' · ' + periodeResa(r)) + '">' + (long && !r.journee ? '<b>' + hDe(r.debut) + '</b> ' : '') + h(r.materiel_nom) + (long && r.nom ? ' · ' + h(r.nom) : '') + '</button>';
  let corps;
  if (F.vue === 'mois') {
    let cases = '';
    for (let i = 0; i < 42; i++) {
      const d = dateDe(du); d.setDate(d.getDate() + i); if (i >= 35 && d.getMonth() !== ref.getMonth()) break;
      const iso = isoJour(d), l = duJour(iso);
      cases += '<div class="jour' + (d.getMonth() !== ref.getMonth() ? ' hors' : '') + (iso === auj() ? ' auj' : '') + '"><button class="n mat-n" data-jour="' + iso + '" aria-label="' + h(fmt(iso, { day: 'numeric', month: 'long' })) + '">' + d.getDate() + '</button>' + l.slice(0, 3).map(r => evt(r, false)).join('') + (l.length > 3 ? '<button class="plus-evt" data-jour="' + iso + '">+ ' + (l.length - 3) + '</button>' : '') + '</div>';
    }
    corps = '<div class="mois">' + ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map(j => '<div class="jsem">' + j + '</div>').join('') + cases + '</div>';
  } else if (F.vue === 'semaine') {
    let cols = '';
    for (let i = 0; i < 7; i++) { const d = dateDe(du); d.setDate(d.getDate() + i); const iso = isoJour(d), l = duJour(iso); cols += '<div class="col' + (iso === auj() ? ' auj' : '') + '"><h4><button class="mat-n-sem" data-jour="' + iso + '">' + d.toLocaleDateString('fr-FR', { weekday: 'long' }) + '<b>' + d.getDate() + '</b></button></h4>' + (l.length ? l.map(r => evt(r, true)).join('') : '<span class="tres-petit muted">—</span>') + '</div>'; }
    corps = '<div class="semaine">' + cols + '</div>';
  } else {
    const l = duJour(du);
    corps = l.length ? '<ul class="mat-jour">' + l.map(r => '<li><span class="mat-heure">' + (r.journee || r.debut.slice(0, 10) < du ? (r.debut.slice(0, 10) < du ? 'depuis le ' + fmt(r.debut.slice(0, 10), { day: 'numeric', month: 'short' }) : 'Journée') : hDe(r.debut) + ' – ' + (r.fin.slice(0, 10) === du ? hDe(r.fin) : fmt(r.fin.slice(0, 10), { day: 'numeric', month: 'short' }))) + '</span>' + evt(r, true) + pastilleResa(r.statut) + '</li>').join('') + '</ul>'
      : videEtat('calendar', 'Aucune réservation ce jour-là.', M.droits.reserver ? '<button class="btn principal" id="mp-res">' + ic('plus') + 'Réserver pour ce jour</button>' : '');
  }
  c.querySelector('#mp-corps').innerHTML = corps;
  const br = c.querySelector('#mp-res'); if (br) br.onclick = () => { F.form = Object.assign({}, F.form || {}, { j1: du, j2: du, materiel_id: F.filtre || '' }); F.onglet = 'reserver'; vMateriel(el); };
  c.querySelectorAll('[data-jour]').forEach(b => b.onclick = () => { F.ref = b.dataset.jour; F.vue = 'jour'; vuePlanning(c, el); });
  c.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { const r = resas.find(x => x.id === b.dataset.pr); if (r && (r.a_moi || r.nom)) detailResa(r); else if (r) modale(r.materiel_nom, '<p>' + pastilleResa(r.statut) + '</p><p>Réservé ' + h(periodeResa(r)) + '.</p>', '<button class="btn" data-fermer>Fermer</button>'); });
}

const normTxt = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// Texte des réponses : paragraphes, retours à la ligne et liens https cliquables (tout le reste est échappé)
function texteRiche(t) {
  return String(t || '').split(/\n{2,}/).map(par => '<p>' + par.split(/(https:\/\/[^\s<>"']+)/g).map((x, i) => i % 2 ? '<a href="' + h(x.replace(/[.,;:!?)]+$/, '')) + '" target="_blank" rel="noopener">' + h(x) + '</a>' : h(x).replace(/\n/g, '<br>')).join('') + '</p>').join('');
}
function scoreFaq(q, mots) {
  if (!mots.length) return 1;
  const Q = normTxt(q.question), M = normTxt(q.mots_cles), R = normTxt(q.reponse), C = normTxt(q.categorie);
  let s = 0;
  for (const m of mots) { const v = (Q.indexOf(m) > -1 ? 3 : 0) + (M.indexOf(m) > -1 ? 2 : 0) + (C.indexOf(m) > -1 ? 1 : 0) + (R.indexOf(m) > -1 ? 1 : 0); if (!v) return 0; s += v; }
  return s;
}

// Chacun modifie SON profil (le serveur prend l'adresse dans la session, jamais dans la page) ; l'adresse Google,
// le rôle et les permissions ne sont pas modifiables ici.
// Photo : recadrée et compressée dans le navigateur (JPEG carré), vérifiée par le serveur, rangée dans le Drive partagé.
function compresserImage(fichier, cote, maxOctets) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(fichier), img = new Image();
    img.onload = () => {
      try {
        const c = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - c) / 2, sy = (img.naturalHeight - c) / 2;
        const sortie = cote2 => { const cv = document.createElement('canvas'); cv.width = cv.height = cote2; const g = cv.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, cote2, cote2); g.imageSmoothingQuality = 'high'; g.drawImage(img, sx, sy, c, c, 0, 0, cote2, cote2); return cv; };
        const grand = sortie(Math.min(cote, c));
        let q = .88, d = grand.toDataURL('image/jpeg', q);
        while (d.length * .75 > maxOctets && q > .45) { q -= .08; d = grand.toDataURL('image/jpeg', q); }
        const mini = sortie(96).toDataURL('image/jpeg', .8);
        URL.revokeObjectURL(url);
        if (d.length * .75 > maxOctets) return rej({ message: 'Image trop lourde même après compression.' });
        res({ data: d.split(',')[1], url: d, mini: mini, octets: Math.round(d.split(',')[1].length * .75), largeur: grand.width });
      } catch (e) { URL.revokeObjectURL(url); rej({ message: 'Image illisible.' }); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ message: 'Ce fichier n\'est pas une image lisible (JPG, PNG ou WEBP).' }); };
    img.src = url;
  });
}

function fChamp(path, label, type, aide, opts) {
  const v = getP(S.brou, path);
  const id = 'f-' + path.replace(/\./g, '-');
  let inp;
  if (type === 'textarea') inp = '<textarea class="champ" id="' + id + '" data-p="' + path + '">' + h(v) + '</textarea>';
  else if (type === 'bool') return '<label class="interrupteur"><input type="checkbox" data-p="' + path + '" data-t="bool"' + (v ? ' checked' : '') + '><span class="curseur"></span><span><b>' + h(label) + '</b>' + (aide ? '<span class="petit muted" style="display:block">' + h(aide) + '</span>' : '') + '</span></label>';
  else if (type === 'select') inp = '<select class="champ" id="' + id + '" data-p="' + path + '">' + opts.map(o => '<option value="' + h(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + h(o[1]) + '</option>').join('') + '</select>';
  else if (type === 'color') inp = '<div class="couleur"><input type="color" data-p="' + path + '" value="' + h(v) + '" aria-label="' + h(label) + '"><input class="champ" id="' + id + '" data-p="' + path + '" data-t="hex" value="' + h(v) + '" maxlength="7"></div>';
  else inp = '<input class="champ" id="' + id + '" data-p="' + path + '"' + (type === 'number' ? ' type="number" step="any" data-t="number"' : type === 'date' ? ' type="date"' : type === 'url' ? ' type="url" data-t="url" placeholder="https://…"' : '') + (opts && opts.liste ? ' list="' + opts.liste + '"' : '') + (opts && opts.ph ? ' placeholder="' + h(opts.ph) + '"' : '') + ' value="' + h(v) + '">';
  return '<div class="form-ligne"><label for="' + id + '">' + h(label) + '</label>' + inp + (aide ? '<div class="aide">' + h(aide) + '</div>' : '') + '</div>';
}
function brancherChamps(corps, apres) {
  corps.querySelectorAll('[data-p]').forEach(x => {
    const maj = () => {
      let v = x.dataset.t === 'bool' ? x.checked : x.value;
      if (x.dataset.t === 'number') v = Number(v);
      if (x.dataset.t === 'url') { const n = lienImage(v); if (n !== v) { v = n; x.value = n; toast('Lien Google Drive converti en lien d\'image.'); } }
      setP(S.brou, x.dataset.p, v);
      if (x.type === 'color' || x.dataset.t === 'hex') corps.querySelectorAll('[data-p="' + x.dataset.p + '"]').forEach(y => { if (y !== x && /^#[0-9a-f]{6}$/i.test(v)) y.value = v; });
      if (/^(apparence|animations)\./.test(x.dataset.p) && S.ui.apercuDirect !== false) appliquerApparence(S.brou);   // aperçu en direct, rien n'est enregistré
      marquerSale(); if (apres) apres(x);
    };
    x.addEventListener(x.tagName === 'SELECT' || x.type === 'checkbox' || x.dataset.t === 'url' ? 'change' : 'input', maj);
  });
}

async function lireFichiersProjet(files) {
  const out = [];
  for (const f of Array.from(files || [])) {
    if (f.size > 25 * 1048576) throw { message: '« ' + f.name + ' » est trop volumineux (' + taille(f.size) + ').' };
    if (/\.zip$/i.test(f.name) || f.type === 'application/zip' || f.type === 'application/x-zip-compressed') (await api('api_projetLireZip', await lireBase64(f))).forEach(x => out.push(x));
    else out.push({ nom: f.name, contenu: await lireTexte(f) });
  }
  return out;
}

    const sections = Array.from(m.querySelectorAll('[data-s]:checked')).map(i => i.dataset.s);
    if (!sections.length) return toast('Cochez au moins une partie.', true);
    if (!confirm('Remplacer ' + sections.length + ' partie(s) de la configuration actuelle ? Une sauvegarde est faite automatiquement avant.')) return;
    occupe(ev.currentTarget, true);
    try { await api('api_importer', texte, sections, motif); fermerModale(); S.ses = await api('api_session'); await chargerAdmin(); oublierDemandes(); S.cal = null; toast('Configuration appliquée. L\'ancienne version est sauvegardée.'); rendre(); }
    catch (x) { erreurDetaillee(x); occupe(ev.currentTarget, false); }
  };
}

// ================================================================ CONNEXION
/* Parcours d'entrée : page de connexion → authentification Google → vérification serveur (compte autorisé, actif,
   rôle, permissions) → session → application. Rien d'interne n'est chargé avant. Cette page n'est qu'une porte :
   l'identité est établie par Google et contrôlée par le serveur (Code.gs : api_connexionGoogle, identifier_). */
const urlApp = () => (BOOT.public || {}).url || '';
const urlChoixCompte = () => 'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(urlApp());
const titreEspace = P => ((P.connexion || {}).titre || '').trim() || ('Espace Com ' + ((P.identite || {}).code || '')).trim();
const ICONES_POINTS = ['lock', 'shield', 'drive', 'check'];

    '<div class="lx-marque-haut">' + logoMarque + '</div>' +
    '<div class="lx-marque-centre"><div class="lx-surtitre">' + h([I.nom_organisation, I.territoire].filter(Boolean).join(' · ')) + '</div><div class="lx-grand">' + h(titre) + '</div><p class="lx-accroche">' + h(X.sous_titre || '') + '</p>' + points + '</div>' +
