function cadreConnexion(contenu) {
  const P = BOOT.public || {};
  appliquerApparence(P);
  $('#app').innerHTML = htmlConnexion(P, contenu);
}

// Google Identity Services (comptes Google hors du domaine Workspace) : le jeton est vérifié par le serveur auprès de Google
let GIS = null;
function preparerGIS(P) {
  const g = P.google || {};
  if (!g.client_id || g.detecte || GIS) return;
  const init = () => {
    try {
      GIS = google.accounts.oauth2.initTokenClient({
        client_id: g.client_id, scope: 'openid email',
        callback: r => { if (r && r.access_token) connecterGoogle(r.access_token); else etatErreur('Connexion Google annulée ou refusée.'); },
        error_callback: e => etatErreur(e && e.type === 'popup_closed' ? 'La fenêtre Google a été fermée avant la fin de la connexion.' : 'La fenêtre de connexion Google n\'a pas pu s\'ouvrir. Autorisez les fenêtres pour ce site, puis réessayez.'),
      });
    } catch (e) { GIS = null; }
  };
  if (window.google && google.accounts && google.accounts.oauth2) return init();
  if (document.getElementById('gis-script')) return;
  const sc = document.createElement('script'); sc.id = 'gis-script'; sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.onload = init;
  document.head.appendChild(sc);
}

// États visuels de la carte de connexion
function etatChargement(etape) {
  const b = $('#cx-google'); if (b) { b.disabled = true; b.classList.add('lx-occupe'); }
  const z = $('#lx-etapes'); if (!z) return;
  z.hidden = false;
  z.querySelectorAll('li').forEach((li, i) => { li.className = i < etape ? 'fait' : i === etape ? 'encours' : ''; });
}
function etatErreur(texte) {
  const b = $('#cx-google'); if (b) { b.disabled = false; b.classList.remove('lx-occupe'); }
  const z = $('#lx-etapes'); if (z) z.hidden = true;
  const m = $('#cx-msg'); if (m) m.innerHTML = '<div class="lx-alerte" role="alert">' + ic('alert') + '<span>' + h(texte) + '</span></div>';
}

function connecterGoogle(jeton) {
  etatChargement(1);
  const fin = r => {
    if (r && r.ok) { etatChargement(2); BOOT.code = ''; if (INSCR.intention && r.data.existant) INSCR.message = 'Un profil existe déjà pour ce compte Google : il a été retrouvé.'; INSCR.intention = false; return ouvrirSession(r.data.sid, r.data.demarrage); }
    if (r && r.erreur === 'refuse') return ecranRefus(r.email, r.message, r.statut);
    if (r && r.erreur === 'profil_absent') return ecranInscription(r);
    if (r && r.erreur === 'google_inconnu' && r.gis && GIS) { etatErreur(''); try { GIS.requestAccessToken(); } catch (e) { } return; }
    etatErreur((r && r.message) || 'Connexion impossible.');
  };
  serveur().withSuccessHandler(fin).withFailureHandler(() => etatErreur('La connexion au serveur a échoué. Vérifiez votre connexion internet puis réessayez.')).api_connexionGoogle(jeton || '', ouvrirSurAccueil());
}

function ecranConnexion(message, deconnecte) {
  fermerModale(); masquerApercu();
  const P = BOOT.public || {}, mode = P.auth || 'google', G = P.google || {};
  const viaGoogle = mode !== 'lien', lienMail = mode !== 'google';
  const code = BOOT.code && lienMail ? BOOT.code : '';
  const X = P.connexion || {};
  const blocGoogle = viaGoogle ?
    (G.detecte ? '<div class="lx-compte">' + ic('user') + '<span>Compte Google : <b>' + h(G.email) + '</b></span></div>' : '') +
    '<button class="lx-google" id="cx-google" type="button"><span class="lx-g">' + GOOGLE_G + '</span><span class="lx-txt">Se connecter avec Google</span><span class="lx-roue" aria-hidden="true"></span></button>' +
    '<ol class="lx-etapes" id="lx-etapes" hidden><li>Compte Google</li><li>Vérification de l\'accès</li><li>Ouverture de votre espace</li></ol>' +
    '<p class="lx-autre"><a href="' + lien(urlChoixCompte()) + '" target="_top">Utiliser un autre compte Google</a></p>' +
    (P.inscription !== 'liste' ? '<div class="lx-premiere"><span>Première visite ?</span> <button type="button" class="lx-lien-profil" id="cx-profil">Créer mon profil</button></div>' : '') : '';
  const formLien = '<div id="cx-zone"><div class="form-ligne"><label for="cx-email">Votre adresse e-mail</label><input class="champ" id="cx-email" type="email" autocomplete="email" placeholder="prenom.nom@…"></div>' +
    '<button class="btn ' + (viaGoogle ? '' : 'principal ') + 'bloc" id="cx-ok">' + ic('mail') + 'Recevoir un lien de connexion</button><p class="petit muted" style="margin:8px 0 0">Lien à usage unique, valable ' + h(P.lien_validite_min || 15) + ' minutes.</p></div>';
  cadreConnexion(
    (message ? '<div class="lx-info">' + ic(deconnecte ? 'check' : 'info') + '<span>' + h(message) + '</span></div>' : '') +
    '<div id="cx-msg"></div>' +
    (code ? '<div class="lx-info">' + ic('mail') + '<span>Vous avez ouvert un lien de connexion reçu par e-mail.</span></div><button class="btn principal bloc btn-cta" id="cx-code">' + ic('check') + 'Se connecter</button>' + (viaGoogle ? '<div class="cx-ou">ou</div>' : '') : '') +
    blocGoogle +
    '<p class="lx-reserve">' + ic('shield') + '<span>' + h(X.message || 'Accès réservé aux personnes autorisées.') + '</span></p>' +
    (lienMail ? (viaGoogle ? '<details class="lx-secours"><summary>Pas de compte Google reconnu ? Lien de connexion par e-mail</summary>' + formLien + '</details>' : formLien) : ''));
  preparerGIS(P);
  const demarrerGoogle = () => {
    $('#cx-msg').innerHTML = '';
    etatChargement(0);
    // Hors domaine Workspace avec Google Identity Services : la fenêtre Google s'ouvre directement (dans le geste de l'utilisateur)
    if (!G.detecte && G.client_id && GIS) { try { GIS.requestAccessToken(); } catch (e) { etatErreur('La fenêtre de connexion Google n\'a pas pu s\'ouvrir.'); } return; }
    connecterGoogle('');
  };
  if ($('#cx-google')) $('#cx-google').onclick = () => { INSCR.intention = false; demarrerGoogle(); };
  // Création de profil : on s'authentifie d'abord avec Google ; si un profil existe, il est retrouvé (jamais de doublon)
  if ($('#cx-profil')) $('#cx-profil').onclick = () => { INSCR.intention = true; demarrerGoogle(); };
  if ($('#cx-code')) $('#cx-code').onclick = ev => {
    occupe(ev.currentTarget, true);
    serveur().withSuccessHandler(r => {
      if (r && r.ok) { BOOT.code = ''; return ouvrirSession(r.data.sid, r.data.demarrage); }
      occupe(ev.currentTarget, false);
      if (r && r.erreur === 'refuse') return ecranRefus(r.email, r.message, r.statut);
      BOOT.code = ''; ecranConnexion((r && r.message) || 'Connexion impossible.');
    }).withFailureHandler(() => { occupe(ev.currentTarget, false); etatErreur('La connexion au serveur a échoué.'); }).api_connexionLien(code, ouvrirSurAccueil());
  };
  if (!lienMail) return;
  const go2 = () => {
    const email = $('#cx-email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Adresse e-mail invalide.', true); return $('#cx-email').focus(); }
    const b = $('#cx-ok'); occupe(b, true);
    serveur().withSuccessHandler(r => {
      if (r && r.ok) $('#cx-zone').innerHTML = '<div class="lx-info">' + ic('check') + '<span><b>Demande enregistrée.</b> Si l\'adresse ' + h(email) + ' est autorisée, un lien de connexion vient de partir (valable ' + h(P.lien_validite_min || 15) + ' minutes, usage unique). Pensez aux courriers indésirables.</span></div>';
      else { toast((r && r.message) || 'Envoi impossible.', true); occupe(b, false); }
    }).withFailureHandler(() => { toast('La connexion au serveur a échoué. Vérifiez votre connexion internet puis réessayez.', true); occupe(b, false); }).api_demanderLien(email);
  };
  $('#cx-ok').onclick = go2;
  $('#cx-email').onkeydown = e => { if (e.key === 'Enter') go2(); };
}

// Compte Google identifié mais non autorisé : aucune donnée n'est chargée
function ecranRefus(email, message, statut) {
  fermerModale();
  const P = BOOT.public || {}, T = P.textes || {};
  const texte = String(message || T.refus_acces || 'Votre compte Google est correctement identifié, mais il ne dispose pas actuellement d\'un accès à {espace}.').replace(/\{espace\}/g, titreEspace(P));
  const titre = statut === 'revoque' ? 'Accès révoqué' : statut === 'desactive' ? 'Accès désactivé' : 'Accès non autorisé';

    (T.refus_aide ? '<p class="petit muted">' + h(T.refus_aide) + '</p>' : '') +

  $('#cx-retour').onclick = () => ecranConnexion('');
}

// ---------------------------------------------------------------- CRÉATION DE PROFIL (inscription libre)
// L'adresse affichée vient de l'identité Google vérifiée par le serveur ; elle n'est pas modifiable ni renvoyée par la page.
// Le rôle attribué est fixé par le serveur (Administration > Connexion et sécurité) : la page ne peut ni le choisir ni le changer.
const INSCR = { intention: false, message: '' };
function ecranInscription(r) {

    '<h2>Créer mon profil</h2><p class="petit muted" style="margin:0 0 14px">Bienvenue ! Aucun profil n\'existe encore pour ce compte. Quelques informations suffisent : votre accès est ouvert dès la validation.</p>' +
    '<div id="cx-msg"></div>' +
    '<div class="form-ligne"><label>Adresse e-mail Google</label><div class="lx-compte" style="margin:0">' + ic('lock') + '<span><b>' + h(r.email) + '</b> <span class="tres-petit">· vérifiée par Google</span></span></div></div>' +

    '<div class="form-ligne"><label for="pf-ul">Unité locale ou délégation <span class="req">*</span></label><select class="champ" id="pf-ul">' + opt(F.ul, 'Choisir…') + '</select></div>' +
    '<div class="form-ligne"><label for="pf-fonction">Fonction <span class="req">*</span></label><select class="champ" id="pf-fonction">' + opt(F.fonctions, 'Choisir…') + '</select></div>' +
    '<div class="form-ligne" id="pf-autre-bloc" hidden><label for="pf-autre">Précisez votre fonction <span class="req">*</span></label><input class="champ" id="pf-autre" maxlength="80"></div>' +
    (tel !== 'masque' ? '<div class="form-ligne"><label for="pf-tel">Téléphone' + (tel === 'obligatoire' ? ' <span class="req">*</span>' : ' <span class="muted">(facultatif)</span>') + '</label><input class="champ" id="pf-tel" type="tel" autocomplete="tel" maxlength="30"></div>' : '') +
    '<div class="lx-cgu"><b>' + h(F.cgu_titre || 'Conditions d\'utilisation') + '</b><div class="lx-cgu-texte" tabindex="0">' + String(F.cgu_texte || '').split('\n').filter(Boolean).map(x => '<p>' + h(x) + '</p>').join('') + '</div>' +
    '<label class="lx-accepte"><input type="checkbox" id="pf-cgu"><span>J\'ai lu et j\'accepte les conditions d\'utilisation de l\'espace interne.</span></label></div>' +
    '<p class="tres-petit muted" style="margin:10px 0 12px">' + ic('shield') + ' Votre accès sera ouvert avec le rôle « ' + h(F.role || '') + ' ». L\'équipe de la délégation peut le faire évoluer.</p>' +
    '<button class="btn principal bloc btn-cta" id="pf-ok">' + ic('check') + 'Créer mon profil et accéder à l\'espace</button>' +

    if (!v('pf-prenom')) manque.push('le prénom'); if (!v('pf-nom')) manque.push('le nom'); if (!v('pf-ul')) manque.push('l\'unité locale'); if (!fonction) manque.push('la fonction');

  setTimeout(() => { const f = $('#pf-prenom'); if (f && window.innerWidth > 900) f.focus(); }, 60);

// Aperçu de la page de connexion (Administration) : rendu avec les réglages en cours, rien n'est enregistré
function apercuConnexion(etat) {
  const B = S.brou;
  const P = { identite: B.identite, connexion: B.connexion, apparence: B.apparence, animations: B.animations, mode: B.mode, auth: B.securite.mode, textes: B.textes, lien_validite_min: B.securite.lien_validite_min, google: { detecte: etat === 'detecte', email: moi().email } };
  const contenu = etat === 'refus' ? '<div class="lx-etat lx-refus"><div class="lx-pastille">' + ic('lock') + '</div><h2>Accès non autorisé</h2><p>' + h(String(B.textes.refus_acces || '').replace(/\{espace\}/g, titreEspace(P))) + '</p><div class="lx-compte">' + ic('user') + '<span><b>prenom.nom@exemple.fr</b></span></div><button class="btn principal bloc">' + ic('left') + 'Revenir à la connexion</button></div>'
    : etat === 'expire' ? '<div class="lx-etat lx-expire"><div class="lx-pastille">' + ic('clock') + '</div><h2>Votre session a expiré</h2><p>' + h(B.textes.session_expiree || '') + '</p><button class="lx-google"><span class="lx-g">' + GOOGLE_G + '</span><span class="lx-txt">Se reconnecter avec Google</span></button></div>'
    : (etat === 'detecte' ? '<div class="lx-compte">' + ic('user') + '<span>Compte Google : <b>' + h(moi().email) + '</b></span></div>' : '') +
      (P.auth !== 'lien' ? '<button class="lx-google"><span class="lx-g">' + GOOGLE_G + '</span><span class="lx-txt">Se connecter avec Google</span></button><p class="lx-autre"><a>Utiliser un autre compte Google</a></p>' : '') +
      '<p class="lx-reserve">' + ic('shield') + '<span>' + h((B.connexion || {}).message || '') + '</span></p>' + (P.auth !== 'google' ? '<details class="lx-secours"><summary>Pas de compte Google reconnu ? Lien de connexion par e-mail</summary></details>' : '');
  masquerApercu();

    '<div class="segment">' + [['normal', 'Connexion'], ['detecte', 'Compte reconnu'], ['refus', 'Accès refusé'], ['expire', 'Session expirée']].map(x => '<button data-etat="' + x[0] + '" class="' + ((etat || 'normal') === x[0] ? 'actif' : '') + '">' + x[1] + '</button>').join('') + '</div>' +
    '<div class="segment"><button data-larg="100%" class="actif">Ordinateur</button><button data-larg="390px">Mobile</button></div><button class="btn petit" id="apx-fermer">' + ic('x') + 'Fermer</button></div>' +
    '<div class="apercu-cx-scene"><div class="apercu-cx-ecran" inert>' + htmlConnexion(P, contenu) + '</div></div>';

  el.querySelectorAll('[data-etat]').forEach(b => b.onclick = () => apercuConnexion(b.dataset.etat));
  el.querySelectorAll('[data-larg]').forEach(b => b.onclick = () => { el.querySelector('.apercu-cx-ecran').style.width = b.dataset.larg; el.querySelector('.apercu-cx-ecran .lx').classList.toggle('lx-mobile', b.dataset.larg !== '100%'); el.querySelectorAll('[data-larg]').forEach(x => x.classList.toggle('actif', x === b)); });

function masquerApercu() { const el = document.getElementById('apercu-cx'); if (el) el.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') masquerApercu(); });

// ---------------------------------------------------------------- SESSION : ouverture, fin, inactivité
async function ouvrirSession(sid, pre) {
  S.token = sid; SES.set(sid); S.diffCache = S.projetsAcc = null; MEMO.vider(); S.aide = null; S.favoris = null; RG.users = null; RG.usersAdmin = null; viderPhotos(); S.mat = null; PLANNING.clear(); oublierDemandes(); S.cal = S.presse = null;   // rien de la session précédente n'est réutilisé
  try { await ouvrirDonnees(pre); }
  catch (e) { if (e && e.erreur !== 'session' && e.erreur !== 'refuse') { finSession(null); ecranConnexion(e.message || 'Connexion impossible.'); } return; }
  const lx = document.querySelector('.lx');
  const niv = document.documentElement.getAttribute('data-anim');
  if (lx && niv !== 'aucune' && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) { lx.classList.add('lx-sortie'); setTimeout(lancerApp, 260); }
  else lancerApp();
}

// Profil, réglages et, si l'application s'ouvre sur l'accueil, les données du tableau de bord : un seul aller-retour
function ouvrirSurAccueil() { return !BOOT.demande && !BOOT.fiche && (!BOOT.vue || BOOT.vue === 'accueil') && (!S.route || S.route.v === 'accueil'); }
// pre : données déjà jointes par le serveur à la réponse de connexion (3.29) — pas de second aller-retour
async function ouvrirDonnees(pre) {
  let r = pre && pre.session ? pre : null;
  if (!r) {
    // Serveur sans api_demarrage (mise à jour partielle) : la connexion aboutit quand même avec api_session ; l'accueil suit
    if (!fonctionDispo('api_demarrage')) { fonctionServeurAbsente('api_demarrage'); S.ses = await api('api_session'); return; }
    r = await api('api_demarrage', ouvrirSurAccueil(), true);
  }
  S.ses = r.session;
  if (r.notifications) recevoirNotifs(r.notifications);
  if (r.accueil) absorberAccueil(r.accueil);
}
// Fin de session (déconnexion, expiration, refus) : on oublie tout ce qui a été chargé
function finSession(message, deconnecte) {
  arreterMinuterie();
  SES.del(); STO.del(CLE_ANCIENNE);
  S.token = ''; S.ses = null; S.mat = null; S.notifs = null; S.favoris = null; bandeauMode(); PLANNING.clear(); S.recentesVerifiees = false; S.diffCache = S.projetsAcc = null; MEMO.vider(); S.dem = S.demArch = S.accueil = S.cal = S.presse = S.admin = S.nd = S.aide = null; RG.users = null; RG.usersAdmin = null; viderPhotos(); S.brou = S.brouT = null; S.ui.adminSale = false; S.avantSave = null;
  viderFichiers();   // fichiers prévisualisés : oubliés à la fin de la session
  S.route = { v: 'accueil' };
  fermerModale(); masquerAvertissement(); masquerApercu();
  $('#app').innerHTML = '';
  try { google.script.history.replace({ v: 'connexion' }, {}, ''); } catch (e) { }
  if (message !== null) ecranConnexion(message || '', deconnecte);
}

function deconnexion() {
  effacerBrouillon();
  const viaGoogle = S.ses && S.ses.user && S.ses.user.via === 'google', sid = S.token;
  try { serveur().withSuccessHandler(() => { }).withFailureHandler(() => { }).api_fermerSession(sid); } catch (e) { }
  finSession(viaGoogle ? 'Vous êtes déconnecté(e) du Centre Com. Votre compte Google reste ouvert dans ce navigateur : sur un ordinateur partagé, déconnectez-vous aussi de Google.' : 'Vous êtes déconnecté(e).', true);
}

/* Déconnexion automatique après INACTIVITÉ (délai réglé dans Administration > Connexion et sécurité).
   - Toute interaction (clic, touche, saisie, défilement, toucher, souris) remet le compteur à zéro.
   - Un avertissement s'affiche avant la fin ; « Rester connecté » prolonge la session côté serveur.
   - Tant que la personne est active, la session serveur est prolongée régulièrement (même sans enregistrer).
   - Le serveur applique le même délai : une session inactive est refusée même si cette page était modifiée. */
const INACT = { derniere: Date.now(), serveur: Date.now(), minuterie: null, avertie: false, prolongation: false };
function delaiInactivite() { return ((S.ses && S.ses.session && Number(S.ses.session.inactivite_min)) || 0) * 60000; }
function noterActivite() { if (!INACT.avertie) INACT.derniere = Date.now(); }
let dernierMouvement = 0;
['click', 'keydown', 'input', 'scroll', 'touchstart', 'wheel'].forEach(t => document.addEventListener(t, noterActivite, { passive: true, capture: true }));
document.addEventListener('mousemove', () => { const n = Date.now(); if (n - dernierMouvement > 5000) { dernierMouvement = n; noterActivite(); } }, { passive: true });
function arreterMinuterie() { if (INACT.minuterie) clearInterval(INACT.minuterie); INACT.minuterie = null; INACT.avertie = false; }
function demarrerMinuterie() {
  arreterMinuterie();
  INACT.derniere = INACT.serveur = Date.now();
  INACT.minuterie = setInterval(verifierInactivite, 1000);
}
function prolonger() {
  if (INACT.prolongation || !S.token) return Promise.resolve();
  INACT.prolongation = true;
  return api('api_prolongerSession').then(() => { INACT.prolongation = false; }, () => { INACT.prolongation = false; });
}
function verifierInactivite() {
  if (!S.ses) return arreterMinuterie();
  if (IMPORT_PH.en_cours) noterActivite();   // un import en cours n'est jamais interrompu par la déconnexion automatique
  const delai = delaiInactivite(), maintenant = Date.now(), inactif = maintenant - INACT.derniere;
  // Garder la session serveur ouverte tant que la personne travaille (lecture, saisie longue…)
  const pas = delai ? Math.max(60000, delai / 3) : 20 * 60000;
  if (INACT.derniere > INACT.serveur && maintenant - INACT.serveur > pas) { INACT.serveur = maintenant; prolonger(); }
  if (!delai) return;
  const avert = Math.min(((S.ses.session && S.ses.session.avertissement_s) || 60) * 1000, delai / 2);
  if (inactif >= delai) { const sid = S.token; try { serveur().withSuccessHandler(() => { }).withFailureHandler(() => { }).api_fermerSession(sid); } catch (e) { } finSession(null); ecranExpire('Déconnexion automatique après ' + Math.round(delai / 60000) + ' minutes d\'inactivité.'); return; }
  if (inactif >= delai - avert) afficherAvertissement(Math.ceil((delai - inactif) / 1000));
}
// Toutes les 2 minutes : l'accès est-il toujours ouvert ? (compte désactivé ou révoqué → arrêt immédiat de l'accès)
// Inutile si un appel vient d'aboutir : chaque appel au serveur fait déjà ce contrôle (session et compte vérifiés par appel_).
setInterval(() => {
  if (!S.ses || !S.token || document.hidden || Date.now() - INACT.serveur < 110000) return;
  const sid = S.token;
  serveur().withSuccessHandler(r => {
    if (!r || r.ok || sid !== S.token) return;
    if (r.erreur === 'refuse') { finSession(null); ecranRefus(r.email, r.message, r.statut); }
    else if (r.erreur === 'session') { finSession(null); ecranExpire(''); }
  }).withFailureHandler(() => { }).api_verifierSession(sid);
}, 120000);
function afficherAvertissement(secondes) {
  let el = document.getElementById('avert-session');
  if (!el) {
    INACT.avertie = true;
    el = document.createElement('div'); el.id = 'avert-session'; el.className = 'voile avert-session';
    el.innerHTML = '<div class="modale" role="alertdialog" aria-modal="true" aria-labelledby="avs-t" aria-describedby="avs-d"><div class="tete"><h2 id="avs-t">' + ic('clock') + ' Session bientôt expirée</h2></div>' +
      '<div class="corps"><p id="avs-d">Votre session va expirer dans <b id="avs-n"></b> secondes en raison de votre inactivité.</p><p class="petit muted">Souhaitez-vous rester connecté ?</p></div>' +
      '<div class="pied"><button class="btn" id="avs-quitter">' + ic('logout') + 'Se déconnecter</button><button class="btn principal" id="avs-rester">' + ic('check') + 'Rester connecté</button></div></div>';
    document.body.appendChild(el);
    el.querySelector('#avs-rester').onclick = async ev => {
      occupe(ev.currentTarget, true);
      try { await api('api_prolongerSession'); INACT.derniere = INACT.serveur = Date.now(); masquerAvertissement(); toast('Session prolongée.'); }
      catch (x) { masquerAvertissement(); }
    };
    el.querySelector('#avs-quitter').onclick = () => { masquerAvertissement(); deconnexion(); };
    setTimeout(() => { const b = el.querySelector('#avs-rester'); if (b) b.focus(); }, 30);
  }

}
function masquerAvertissement() { const el = document.getElementById('avert-session'); if (el) el.remove(); INACT.avertie = false; }

// ================================================================ DÉMARRAGE
// Démarrage : la page de connexion est TOUJOURS affichée à l'ouverture de l'application (tous les rôles).
// Seul un rechargement du même onglet, avec une session encore valide côté serveur, évite de se reconnecter.
async function demarrer() {
  arreterMinuterie(); masquerAvertissement();
  S.diffCache = S.projetsAcc = null; MEMO.vider(); S.dem = S.demArch = S.accueil = S.cal = S.presse = S.admin = S.nd = S.aide = S.mat = S.favoris = null; PLANNING.clear(); S.recentesVerifiees = false; RG.users = null; RG.usersAdmin = null; viderPhotos(); S.ses = null; S.route = { v: 'accueil' }; S.ui.adminSale = false; viderFichiers();
  STO.del(CLE_ANCIENNE);
  if (BOOT.public) appliquerApparence(BOOT.public);
  if (BOOT.public && BOOT.public.animations && BOOT.public.animations.chargement === 'barre') { const e = document.querySelector('.ecran-chargement .spinner'); if (e) e.outerHTML = '<div class="barre-chargement"></div>'; }
  if (BOOT.public && BOOT.public.erreur) { $('#app').innerHTML = videEtat('alert', h(BOOT.public.erreur) + ' L\'administrateur doit exécuter installer() dans Apps Script.'); return; }
  if (!(window.google && google.script && google.script.run)) { $('#app').innerHTML = '<div class="connexion"><div class="boite">' + videEtat('alert', 'Le Centre Com doit être ouvert depuis son adresse Google Apps Script (…/exec) : le service d\'appel serveur de Google n\'est pas disponible ici.') + '</div></div>'; return; }
  if (BOOT.version !== VERSION_APP) {
    console.error('[Centre Com] Versions différentes — interface ' + VERSION_APP + ', serveur ' + (BOOT.version || 'antérieur à 3.6.1'));
    $('#app').innerHTML = '<div class="connexion"><div class="boite" style="max-width:560px">' + videEtat('alert', '<b>Mise à jour incomplète du Centre Com.</b><br>L\'interface (App, version ' + h(VERSION_APP) + ') et le serveur (Code.gs, version ' + h(BOOT.version || 'antérieure à 3.6.1') + ') ne proviennent pas de la même mise à jour : certaines actions échoueraient.<br><span class="petit muted">Administrateur : dans Apps Script, remplacez Code.gs, App, Styles par ceux de la même livraison, vérifiez la ligne « FIN DE … » en bas de chaque fichier, enregistrez, puis Déployer > Gérer les déploiements > Modifier > Nouvelle version.</span>', '<button class="btn" onclick="location.reload()">Réessayer</button>') + '</div></div>';
    return;
  }
  S.token = SES.get();
  if (!S.token) return ecranConnexion('');   // AUCUN accès direct : même un administrateur passe par cette page
  try { await ouvrirDonnees(); }
  catch (e) { if (e && e.erreur !== 'session' && e.erreur !== 'refuse') { finSession(null); $('#app').innerHTML = '<div class="connexion"><div class="boite">' + videEtat('alert', h(e.message || 'Le Centre Com ne répond pas pour le moment.'), '<button class="btn principal" onclick="location.reload()">Réessayer</button>') + '</div></div>'; } return; }
  lancerApp();
}
// Après une connexion validée par le serveur seulement
function lancerApp() {
  if (BOOT.demande) { S.route = { v: 'demande', id: BOOT.demande }; BOOT.demande = ''; }
  else if (BOOT.vue) { S.route = { v: BOOT.vue }; BOOT.vue = ''; }
  else if ((!S.route || S.route.v === 'accueil') && prefs().ouverture && prefs().ouverture !== 'accueil' && PAGES_OUVERTURE().some(x => x[0] === prefs().ouverture)) S.route = { v: prefs().ouverture };   // page d'ouverture choisie (Mon profil)
  try {
    google.script.history.replace(S.route, {}, '');
    // Bouton « précédent » : sans session, aucune page interne n'est réaffichée
    google.script.history.setChangeHandler(ev => { if (!S.ses) { ecranConnexion(''); return; } if (ev.state && ev.state.v && ev.state.v !== 'connexion') { const avant = S.route.v; (S.ui.defil || (S.ui.defil = {}))[avant] = window.scrollY; S.route = Object.assign({}, ev.state, { depuis: avant }); fermerModale(); rendre(); } });
  } catch (e) { }
  if (BOOT.fiche) { S.route = { v: 'admin' }; S.ui.admin = 'utilisateurs'; S.ui.ficheOuvrir = BOOT.fiche; BOOT.fiche = ''; }
  demarrerMinuterie();
  rendre();
  if (INSCR.message) { toast(INSCR.message); INSCR.message = ''; }
}
window.CentreCom = { S: S, go: go, demarrer: demarrer, INACT: INACT, deconnexion: deconnexion, avecPreferences: avecPreferences, api: api, VERSION_APP: VERSION_APP, exporterPhotos: exporterPhotos, hacherFichier: hacherFichier, deCol: deCol };
demarrer();
})();
